              </table>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // =========================================================================
    // VIEW 4: Daily Dispensing Log
    // =========================================================================
    function DailyDispensingView({ currentMonth, dispensingRecords, setDispensingRecords, staffList, isReadOnly = false }) {
      const activeStaff = staffList.filter(s => s.canDispense);
      const monthlyRecords = dispensingRecords.filter(r => r.date.startsWith(currentMonth)).sort((a,b) => a.date.localeCompare(b.date));
      const [showModal, setShowModal] = useState(false);
      const [editingRecord, setEditingRecord] = useState(null);
      const [newDate, setNewDate] = useState(`${currentMonth}-01`);
      const [newIpd, setNewIpd] = useState(0);
      const [newOpd, setNewOpd] = useState(0);
      const [newStaffCounts, setNewStaffCounts] = useState({});

      const openAddModal = () => {
        setEditingRecord(null);
        setNewDate(`${currentMonth}-01`);
        setNewIpd(0);
        setNewOpd(0);
        const initialCounts = {};
        activeStaff.forEach(s => { initialCounts[s.id] = 0; });
        setNewStaffCounts(initialCounts);
        setShowModal(true);
      };

      const openEditModal = (rec) => {
        setEditingRecord(rec);
        setNewDate(rec.date);
        setNewIpd(rec.ipdCount || 0);
        setNewOpd(rec.opdCount || 0);
        setNewStaffCounts({ ...(rec.staffCounts || {}) });
        setShowModal(true);
      };

      const handleDeleteDay = (id, date) => {
        if (confirm(`ยืนยันการลบข้อมูลการจัดยาวันที่ ${formatThaiDateShort(date)} หรือไม่?`)) {
          setDispensingRecords(prev => prev.filter(r => r.id !== id));
        }
      };

      const handleSaveDay = (e) => {
        e.preventDefault();
        const rec = {
          id: editingRecord ? editingRecord.id : `d-${Date.now()}`,
          date: newDate,
          ipdCount: Number(newIpd) || 0,
          opdCount: Number(newOpd) || 0,
          staffCounts: newStaffCounts
        };
        if (editingRecord) {
          const dupOther = dispensingRecords.find(r => r.date === newDate && r.id !== editingRecord.id);
          if (dupOther && !confirm(`วันที่ ${formatThaiDateShort(newDate)} มีข้อมูลอยู่แล้ว ต้องการบันทึกทับหรือไม่?`)) return;
          setDispensingRecords(prev => prev.filter(r => r.id !== editingRecord.id && r.date !== newDate).concat(rec));
        } else {
          const exists = dispensingRecords.find(r => r.date === newDate);
          if (exists && !confirm(`วันที่ ${formatThaiDateShort(newDate)} มีข้อมูลอยู่แล้ว ต้องการบันทึกทับหรือไม่?`)) return;
          setDispensingRecords(prev => [...prev.filter(r => r.date !== newDate), rec]);
        }
        setShowModal(false);
      };

      const totalIPD = monthlyRecords.reduce((s, r) => s + (Number(r.ipdCount)||0), 0);
      const totalOPD = monthlyRecords.reduce((s, r) => s + (Number(r.opdCount)||0), 0);
      let grandDisp = 0;
      const staffTot = {};
      activeStaff.forEach(s => {
        const sum = monthlyRecords.reduce((a, r) => a + (Number(r.staffCounts?.[s.id])||0), 0);
        staffTot[s.id] = sum;
        grandDisp += sum;
      });

      return (
        <div className="space-y-4">
          <div className="flex justify-between items-center">
            <h2 className="text-lg font-bold font-prompt text-slate-800">บันทึกการจัดยาประจำวัน ({formatThaiMonthYear(currentMonth)})</h2>
            {!isReadOnly && (
              <button onClick={openAddModal} className="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-xs font-bold cursor-pointer">+ เพิ่มข้อมูลประจำวัน</button>
            )}
          </div>
          <div className="bg-white rounded-2xl border border-slate-300 shadow-xs overflow-x-auto">
            <table className="w-full text-center border-collapse text-xs">
              <thead>
                <tr className="bg-slate-100 font-bold border-b border-slate-300">
                  <th className="py-3 px-3 border-r border-slate-300 bg-slate-200">วันที่</th>
                  <th className="py-3 px-3 border-r border-slate-300 bg-blue-50">IPD</th>
                  <th className="py-3 px-3 border-r border-slate-300 bg-blue-50">OPD</th>
                  <th className="py-3 px-3 border-r border-slate-300 bg-blue-100">รวม</th>
                  {activeStaff.map(s => <th key={s.id} className="py-3 px-3 border-r border-slate-300">{s.shortName}</th>)}
                  <th className="py-3 px-3 bg-teal-100">รวมจัดยา</th>
                  {!isReadOnly && <th className="py-3 px-3 border-l border-slate-300 w-24 no-print">จัดการ</th>}
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-200">
                {monthlyRecords.length === 0 ? (
                  <tr>
                    <td colSpan={(isReadOnly ? 5 : 6) + activeStaff.length} className="py-8 text-center text-slate-400">
                      ยังไม่มีข้อมูลการจัดยาในเดือน {formatThaiMonthYear(currentMonth)}
                    </td>
                  </tr>
                ) : (
                  monthlyRecords.map(r => {
                    const pTot = (Number(r.ipdCount)||0) + (Number(r.opdCount)||0);
                    let dTot = 0;
                    return (
                      <tr key={r.id} className="hover:bg-slate-50/80 transition-colors">
                        <td className="py-2.5 px-3 border-r border-slate-300 font-semibold bg-slate-50 whitespace-nowrap">{formatThaiDateShort(r.date)}</td>
                        <td className="py-2.5 px-3 border-r border-slate-300">{r.ipdCount}</td>
                        <td className="py-2.5 px-3 border-r border-slate-300">{r.opdCount}</td>
                        <td className="py-2.5 px-3 border-r border-slate-300 font-bold bg-blue-50/40">{pTot}</td>
                        {activeStaff.map(s => { const c = Number(r.staffCounts?.[s.id])||0; dTot+=c; return <td key={s.id} className="py-2.5 px-3 border-r border-slate-300">{c}</td>; })}
                        <td className="py-2.5 px-3 font-bold bg-teal-50">{dTot}</td>
                        {!isReadOnly && (
                          <td className="py-2.5 px-3 border-l border-slate-300 no-print whitespace-nowrap">
                            <button onClick={() => openEditModal(r)} className="text-teal-600 hover:underline font-semibold mr-2.5 cursor-pointer">แก้</button>
                            <button onClick={() => handleDeleteDay(r.id, r.date)} className="text-rose-600 hover:underline font-semibold cursor-pointer">ลบ</button>
                          </td>
                        )}
                      </tr>
                    );
                  })
                )}
              </tbody>
              <tfoot>
                <tr className="bg-amber-100 font-bold border-t-2 border-slate-400">
                  <td className="py-3 px-3 border-r border-slate-400 bg-amber-200">รวมทั้งเดือน</td>
                  <td className="py-3 px-3 border-r border-slate-400">{totalIPD}</td>
                  <td className="py-3 px-3 border-r border-slate-400">{totalOPD}</td>
                  <td className="py-3 px-3 border-r border-slate-400 bg-blue-200">{totalIPD+totalOPD}</td>
                  {activeStaff.map(s => <td key={s.id} className="py-3 px-3 border-r border-slate-400">{staffTot[s.id]}</td>)}
                  <td className="py-3 px-3 bg-teal-200">{grandDisp}</td>
                  {!isReadOnly && <td className="py-3 px-3 border-l border-slate-400 no-print"></td>}
                </tr>
              </tfoot>
            </table>
          </div>
          {showModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-6 max-w-lg w-full shadow-2xl border border-slate-100">
                <h3 className="font-bold font-prompt text-base mb-4 text-slate-800 border-b pb-2">
                  {editingRecord ? `แก้ไขข้อมูลการจัดยา (${formatThaiDateShort(editingRecord.date)})` : 'เพิ่มข้อมูลการจัดยาประจำวัน'}
                </h3>
                <form onSubmit={handleSaveDay} className="space-y-3 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">วันที่:</label>
                    <input type="date" required value={newDate} onChange={e=>setNewDate(e.target.value)} className="w-full border border-slate-300 p-2 rounded-xl" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-semibold text-blue-800 mb-1">จำนวนคนไข้ IPD:</label>
                      <input type="number" min="0" value={newIpd} onChange={e=>setNewIpd(e.target.value)} className="w-full border border-slate-300 p-2 rounded-xl" />
                    </div>
                    <div>
                      <label className="block font-semibold text-blue-800 mb-1">จำนวนคนไข้ OPD:</label>
                      <input type="number" min="0" value={newOpd} onChange={e=>setNewOpd(e.target.value)} className="w-full border border-slate-300 p-2 rounded-xl" />
                    </div>
                  </div>
                  <div className="pt-2 border-t">
                    <label className="block font-semibold text-slate-700 mb-2">จำนวนจัดยาแยกตามเจ้าหน้าที่:</label>
                    <div className="grid grid-cols-2 gap-2">
                      {activeStaff.map(s => (
                        <div key={s.id} className="flex justify-between items-center p-2 bg-slate-50 rounded-xl border border-slate-200">
                          <span className="font-medium text-slate-700">{s.shortName}</span>
                          <input type="number" min="0" value={newStaffCounts[s.id]||0} onChange={e=>setNewStaffCounts({...newStaffCounts,[s.id]:Number(e.target.value)||0})} className="w-20 border border-slate-300 text-center p-1 rounded-lg bg-white font-semibold" />
                        </div>
                      ))}
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-3 border-t">
                    <button type="button" onClick={()=>setShowModal(false)} className="px-4 py-2 bg-slate-100 rounded-xl font-medium cursor-pointer">ยกเลิก</button>
                    <button type="submit" className="px-5 py-2 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl cursor-pointer">บันทึกข้อมูล</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // VIEW 4.5: ข้อมูลย้อนหลัง & จุดบันทึกอัตโนมัติ (History Archive)
    // =========================================================================
    function HistoryArchiveView({
      currentMonth,
      onSelectMonthAndView,
      dispensingRecords,
      staffList,
      detailedErrors,
      staffMatrixErrors,
      keyingErrors,
      snapshots,
      lastSavedAt,
      autoBackupFileName,
      onPickAutoBackupFile,
      onCreateManualSnapshot,
      onRestoreSnapshot,
      onDeleteSnapshot,
      onExportMonthExcel,
      onExportAllHistoryExcel,
      onDownloadJsonBackup,
      onImportJsonBackup,
      isReadOnly = false
    }) {
      const [selectedYear, setSelectedYear] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [searchCategory, setSearchCategory] = useState('all');

      const activeStaff = staffList.filter(s => s.canDispense);

      // Build monthly summaries across all recorded months
      const monthSet = new Set();
      (dispensingRecords || []).forEach(r => r.date && monthSet.add(r.date.slice(0, 7)));
      (detailedErrors || []).forEach(e => e.date && monthSet.add(e.date.slice(0, 7)));
      (staffMatrixErrors || []).forEach(m => m.date && monthSet.add(m.date.slice(0, 7)));
      (keyingErrors || []).forEach(k => k.date && monthSet.add(k.date.slice(0, 7)));
      const sortedMonths = Array.from(monthSet).sort((a, b) => b.localeCompare(a));

      const monthlySummaries = sortedMonths.map(month => {
        const disp = (dispensingRecords || []).filter(r => r.date.startsWith(month));
        const det = (detailedErrors || []).filter(e => e.date.startsWith(month));
        const mat = (staffMatrixErrors || []).filter(m => m.date.startsWith(month));
        const key = (keyingErrors || []).filter(k => k.date.startsWith(month));
        let totalDispensed = 0;
        let totalPatients = 0;
        disp.forEach(r => {
          totalPatients += (Number(r.ipdCount)||0) + (Number(r.opdCount)||0);
          Object.values(r.staffCounts || {}).forEach(v => { totalDispensed += Number(v)||0; });
        });
        return {
          month,
          year: month.slice(0, 4),
          label: formatThaiMonthYear(month),
          workingDays: disp.length,
          totalPatients,
          totalDispensed,
          wrongDrug: det.filter(i => i.type === 'wrong_drug').length,
          incompleteQty: det.filter(i => i.type === 'incomplete_qty').length,
          incompleteBasket: det.filter(i => i.type === 'incomplete_basket').length,
          wrongStrength: det.filter(i => i.type === 'wrong_strength').length,
          totalDetailed: det.length,
          matrixDisp: mat.length,
          matrixKey: key.length
        };
      });

      const availableYears = Array.from(new Set(monthlySummaries.map(m => m.year))).sort((a, b) => b.localeCompare(a));
      const filteredMonths = selectedYear === 'all' ? monthlySummaries : monthlySummaries.filter(m => m.year === selectedYear);

      const chartMonths = [...filteredMonths].reverse();
      const multiMonthChartData = {
        labels: chartMonths.map(m => m.label),
        datasets: [
          { label: 'ยอดจัดยา (ใบ)', data: chartMonths.map(m => m.totalDispensed), backgroundColor: '#0d9488', borderRadius: 6, yAxisID: 'y' },
          { label: 'Mederror ยา (ครั้ง)', data: chartMonths.map(m => m.totalDetailed), backgroundColor: '#f43f5e', borderRadius: 6, yAxisID: 'y1' }
        ]
      };

      const q = searchQuery.trim().toLowerCase();
      const searchResults = [];
      if (searchCategory === 'all' || searchCategory !== 'dispensing') {
        (detailedErrors || []).forEach(item => {
          if (searchCategory !== 'all' && item.type !== searchCategory) return;
          const text = [item.date, formatThaiDateShort(item.date), item.targetDrug, item.errorDrug, item.drugName, item.targetQty, item.errorQty, item.notes].filter(Boolean).join(' ').toLowerCase();
          if (!q || text.includes(q)) searchResults.push({ kind: 'error', sortDate: item.date, month: item.date?.slice(0,7), item });
        });
      }
      if (searchCategory === 'all' || searchCategory === 'dispensing') {
        (dispensingRecords || []).forEach(rec => {
          const text = `${rec.date} ${formatThaiDateShort(rec.date)} ipd ${rec.ipdCount} opd ${rec.opdCount}`.toLowerCase();
          if (!q || text.includes(q)) searchResults.push({ kind: 'dispensing', sortDate: rec.date, month: rec.date?.slice(0,7), item: rec });
        });
      }
      searchResults.sort((a, b) => (b.sortDate||'').localeCompare(a.sortDate||''));
      const visibleResults = searchResults.slice(0, 100);

      const typeTagMap = {
        wrong_drug: { text: '1. จัดยาผิดชนิด', cls: 'bg-rose-100 text-rose-800 border-rose-200' },
        incomplete_qty: { text: '2. ไม่ครบจำนวน', cls: 'bg-amber-100 text-amber-800 border-amber-200' },
        incomplete_basket: { text: '3. ไม่ครบในตะกร้า', cls: 'bg-purple-100 text-purple-800 border-purple-200' },
        wrong_strength: { text: '4. ผิดความแรง', cls: 'bg-sky-100 text-sky-800 border-sky-200' }
      };

      const canPickFile = typeof window.showSaveFilePicker === 'function';

      return (
        <div className="space-y-6 pb-12">
          {/* Header Banner */}
          <div className="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs flex flex-col lg:flex-row lg:items-center justify-between gap-4">
            <div>
              <h2 className="text-lg font-bold font-prompt text-slate-800">บันทึกข้อมูลอัตโนมัติ & เรียกดูข้อมูลย้อนหลัง</h2>
              <p className="text-xs text-slate-500 mt-0.5">ระบบบันทึกข้อมูลลงบราวเซอร์ (localStorage + IndexedDB) อัตโนมัติทุกครั้งที่แก้ไข พร้อมดูประวัติย้อนหลังและกู้คืนจุดสำรอง</p>
            </div>
            <div className="flex flex-wrap gap-2">
              <button onClick={onCreateManualSnapshot} className="px-3.5 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-xs font-bold shadow-xs cursor-pointer">
                📌 บันทึกจุดสำรองตอนนี้
              </button>
              <button onClick={onExportAllHistoryExcel} className="px-3.5 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-200 rounded-xl text-xs font-bold cursor-pointer">
                📊 ส่งออกประวัติทุกเดือน (Excel)
              </button>
            </div>
          </div>

          {/* Auto-Save Status Cards */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="bg-white rounded-2xl p-4 border border-emerald-200 shadow-xs">
              <p className="text-xs font-bold text-slate-800">สถานะบันทึกอัตโนมัติในเครื่อง</p>
              <p className="text-xs text-emerald-700 font-semibold mt-1">● บันทึกอัตโนมัติแล้ว (localStorage + IndexedDB)</p>
              <p className="text-2xs text-slate-500 mt-1">อัปเดตล่าสุด: {lastSavedAt || '-'}</p>
            </div>

            <div className="bg-white rounded-2xl p-4 border border-sky-200 shadow-xs">
              <p className="text-xs font-bold text-slate-800">บันทึกลงไฟล์คอมพิวเตอร์อัตโนมัติ (.json)</p>
              <p className="text-2xs text-slate-500 mt-1 truncate">
                {autoBackupFileName ? `เชื่อมต่อไฟล์: ${autoBackupFileName}` : 'เลือกไฟล์ 1 ครั้ง เพื่อซิงค์ข้อมูลลงไฟล์คอมพิวเตอร์อัตโนมัติ'}
              </p>
              {!isReadOnly && (
                canPickFile ? (
                  <button onClick={onPickAutoBackupFile} className="mt-2 px-3 py-1 bg-sky-600 hover:bg-sky-700 text-white rounded-lg text-2xs font-bold cursor-pointer">
                    {autoBackupFileName ? 'เปลี่ยนไฟล์อัตโนมัติ' : 'เลือกไฟล์บันทึกอัตโนมัติ (.json)'}
                  </button>
                ) : (
                  <span className="inline-block mt-1.5 text-2xs text-amber-700">ใช้ปุ่มดาวน์โหลด/นำเข้าไฟล์ .json ด้านขวา</span>
                )
              )}
            </div>

            <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-xs">
              <p className="text-xs font-bold text-slate-800">สำรอง / กู้คืนข้ามเครื่อง (.json)</p>
              <p className="text-2xs text-slate-500 mt-1">ดาวน์โหลดเก็บไว้ หรือนำเข้าไฟล์เดิมกลับมาดูย้อนหลัง</p>
              <div className="flex flex-wrap gap-2 mt-2">
                <button onClick={onDownloadJsonBackup} className="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-2xs font-bold border border-slate-200 cursor-pointer">
                  ⬇️ ดาวน์โหลด .json
                </button>
                {!isReadOnly && (
                  <label className="px-2.5 py-1 bg-teal-50 hover:bg-teal-100 text-teal-800 rounded-lg text-2xs font-bold border border-teal-200 cursor-pointer">
                    ⬆️ กู้คืนจากไฟล์
                    <input type="file" accept=".json" onChange={onImportJsonBackup} className="hidden" />
                  </label>
                )}
              </div>
            </div>
          </div>

          {/* Section 1: Monthly Archive */}
          <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
            <div className="px-5 py-4 bg-slate-50 border-b border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <h3 className="text-sm font-bold text-slate-800 font-prompt">สรุปข้อมูลย้อนหลังรายเดือน ({filteredMonths.length} เดือนที่มีข้อมูล)</h3>
                <p className="text-2xs text-slate-500">ดูยอดรวมย้อนหลังแต่ละเดือน หรือคลิก "เปิดดู" เพื่อสลับไปเดือนนั้นทันที</p>
              </div>
              <div className="flex items-center gap-2 text-xs">
                <span className="text-slate-500 font-medium">กรองตามปี:</span>
                <select value={selectedYear} onChange={e => setSelectedYear(e.target.value)} className="bg-white border border-slate-200 rounded-xl px-3 py-1.5 font-semibold text-slate-700 cursor-pointer">
                  <option value="all">ทุกปีทั้งหมด ({monthlySummaries.length} เดือน)</option>
                  {availableYears.map(yr => <option key={yr} value={yr}>พ.ศ. {Number(yr)+543} ({yr})</option>)}
                </select>
              </div>
            </div>

            <div className="p-5 space-y-5">
              {chartMonths.length > 0 && (
                <div className="bg-slate-50/70 rounded-xl p-4 border border-slate-200/70">
                  <h4 className="text-xs font-bold text-slate-700 font-prompt mb-2">กราฟเปรียบเทียบยอดจัดยาและ Mederror ย้อนหลังรายเดือน</h4>
                  <ChartBox
                    type="bar"
                    data={multiMonthChartData}
                    options={{
                      plugins: { legend: { position: 'top' } },
                      scales: {
                        y: { type: 'linear', position: 'left', beginAtZero: true },
                        y1: { type: 'linear', position: 'right', beginAtZero: true, grid: { drawOnChartArea: false }, ticks: { stepSize: 1 } }
                      }
                    }}
                    height="220px"
                  />
                </div>
              )}

              <div className="overflow-x-auto">
                <table className="w-full text-xs text-center border-collapse border border-slate-200">
                  <thead>
                    <tr className="bg-slate-100 text-slate-700 font-bold border-b border-slate-300">
                      <th className="py-2.5 px-3 text-left border-r border-slate-200">เดือน / ปี</th>
                      <th className="py-2.5 px-2.5 border-r border-slate-200">วันบันทึก</th>
                      <th className="py-2.5 px-2.5 border-r border-slate-200">ผู้ป่วยรวม</th>
                      <th className="py-2.5 px-2.5 border-r border-slate-200 text-teal-800">ยอดจัดยา</th>
                      <th className="py-2.5 px-2 border-r border-slate-200 text-rose-700">ผิดชนิด</th>
                      <th className="py-2.5 px-2 border-r border-slate-200 text-amber-700">ไม่ครบจำนวน</th>
                      <th className="py-2.5 px-2 border-r border-slate-200 text-purple-700">ไม่ครบตะกร้า</th>
                      <th className="py-2.5 px-2 border-r border-slate-200 text-sky-700">ผิดความแรง</th>
                      <th className="py-2.5 px-2.5 border-r border-slate-200 bg-rose-50 text-rose-800">รวม Mederror ยา</th>
                      <th className="py-2.5 px-2.5 border-r border-slate-200">รายบุคคล (จัด/คีย์)</th>
                      <th className="py-2.5 px-3">เรียกดู</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-200">
                    {filteredMonths.length === 0 ? (
                      <tr><td colSpan={11} className="py-8 text-slate-400">ยังไม่มีข้อมูลย้อนหลัง</td></tr>
                    ) : (
                      filteredMonths.map(m => (
                        <tr key={m.month} className={`hover:bg-slate-50 ${m.month === currentMonth ? 'bg-teal-50/40' : ''}`}>
                          <td className="py-2.5 px-3 text-left font-bold text-slate-900 border-r border-slate-200 whitespace-nowrap">
                            {m.label}
                            {m.month === currentMonth && <span className="ml-2 text-2xs px-1.5 py-0.5 rounded bg-teal-100 text-teal-800 font-semibold">กำลังดู</span>}
                          </td>
                          <td className="py-2.5 px-2.5 border-r border-slate-200">{m.workingDays}</td>
                          <td className="py-2.5 px-2.5 border-r border-slate-200">{m.totalPatients.toLocaleString()}</td>
                          <td className="py-2.5 px-2.5 border-r border-slate-200 font-bold text-teal-700">{m.totalDispensed.toLocaleString()}</td>
                          <td className="py-2.5 px-2 border-r border-slate-200 font-semibold text-rose-600">{m.wrongDrug}</td>
                          <td className="py-2.5 px-2 border-r border-slate-200 font-semibold text-amber-600">{m.incompleteQty}</td>
                          <td className="py-2.5 px-2 border-r border-slate-200 font-semibold text-purple-600">{m.incompleteBasket}</td>
                          <td className="py-2.5 px-2 border-r border-slate-200 font-semibold text-sky-600">{m.wrongStrength}</td>
                          <td className="py-2.5 px-2.5 border-r border-slate-200 bg-rose-50/40 font-extrabold text-rose-700">{m.totalDetailed}</td>
                          <td className="py-2.5 px-2.5 border-r border-slate-200 text-slate-600">{m.matrixDisp} / {m.matrixKey}</td>
                          <td className="py-2.5 px-3 whitespace-nowrap space-x-1">
                            <button onClick={() => onSelectMonthAndView(m.month, 'detailed_tables')} className="px-2 py-1 bg-teal-600 hover:bg-teal-700 text-white rounded-lg text-2xs font-bold cursor-pointer">เปิดดู</button>
                            <button onClick={() => onSelectMonthAndView(m.month, 'dashboard')} className="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-2xs font-bold border border-slate-200 cursor-pointer">แดชบอร์ด</button>
                            <button onClick={() => onExportMonthExcel(m.month)} className="px-2 py-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 rounded-lg text-2xs font-bold border border-emerald-200 cursor-pointer">Excel</button>
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          {/* Section 2: Global Search */}
          <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
            <div className="px-5 py-4 bg-slate-50 border-b border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-3">
              <div>
                <h3 className="text-sm font-bold text-slate-800 font-prompt">ค้นหาข้อมูลย้อนหลังข้ามทุกเดือน (Global Search)</h3>
                <p className="text-2xs text-slate-500">ค้นหาชื่อยา คู่ยา หรือวันที่จากข้อมูลทั้งหมดทุกเดือน (สูงสุด 100 รายการล่าสุด)</p>
              </div>
              <div className="flex flex-wrap gap-2">
                <input
                  type="text"
                  placeholder="🔍 พิมพ์ชื่อยา หรือวันที่..."
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  className="px-3 py-1.5 text-xs bg-white border border-slate-200 rounded-xl w-56"
                />
                <select value={searchCategory} onChange={e => setSearchCategory(e.target.value)} className="text-xs bg-white border border-slate-200 rounded-xl px-3 py-1.5 font-semibold text-slate-700 cursor-pointer">
                  <option value="all">ทุกประเภท</option>
                  <option value="wrong_drug">1. จัดยาผิดชนิด</option>
                  <option value="incomplete_qty">2. จัดยาไม่ครบจำนวน</option>
                  <option value="incomplete_basket">3. ไม่ครบในตะกร้า</option>
                  <option value="wrong_strength">4. จัดยาผิดความแรง</option>
                  <option value="dispensing">การจัดยาประจำวัน</option>
                </select>
              </div>
            </div>
            <div className="p-4 max-h-96 overflow-y-auto">
              {visibleResults.length === 0 ? (
                <p className="text-center text-xs text-slate-400 py-8">ไม่พบข้อมูลที่ตรงกับคำค้นหา</p>
              ) : (
                <div className="divide-y divide-slate-100 text-xs">
                  {visibleResults.map((entry, idx) => {
                    if (entry.kind === 'error') {
                      const i = entry.item;
                      const tag = typeTagMap[i.type] || { text: i.type, cls: 'bg-slate-100 text-slate-700 border-slate-200' };
                      return (
                        <div key={`err-${i.id}-${idx}`} className="py-2.5 flex flex-col sm:flex-row sm:items-center justify-between gap-2 hover:bg-slate-50 px-2 rounded-lg">
                          <div className="flex flex-wrap items-center gap-2">
                            <span className="font-bold text-slate-700 w-20 shrink-0">{formatThaiDateShort(i.date)}</span>
                            <span className={`px-2 py-0.5 rounded-full text-2xs font-bold border ${tag.cls}`}>{tag.text}</span>
                            {i.type === 'wrong_drug' || i.type === 'wrong_strength' ? (
                              <span className="font-semibold text-slate-800"><span className="text-emerald-700">{i.targetDrug}</span> ➔ <span className="text-rose-700">{i.errorDrug}</span></span>
                            ) : i.type === 'incomplete_qty' ? (
                              <span className="font-semibold text-slate-800">{i.drugName} <span className="text-slate-500">({i.targetQty} ➔ {i.errorQty})</span></span>
                            ) : (
                              <span className="font-semibold text-purple-900">{i.drugName} (ขาด {i.missingCount || 1} รายการ)</span>
                            )}
                          </div>
                          <button onClick={() => onSelectMonthAndView(entry.month, 'detailed_tables')} className="text-2xs text-teal-700 hover:underline font-semibold shrink-0 cursor-pointer">
                            เปิดเดือน {formatThaiMonthYear(entry.month)} ➔
                          </button>
                        </div>
                      );
                    } else {
                      const rec = entry.item;
                      const totStaff = activeStaff.reduce((acc, s) => acc + (Number(rec.staffCounts?.[s.id])||0), 0);
                      return (
                        <div key={`disp-${rec.id}-${idx}`} className="py-2.5 flex flex-col sm:flex-row sm:items-center justify-between gap-2 hover:bg-slate-50 px-2 rounded-lg">
                          <div className="flex flex-wrap items-center gap-2">
                            <span className="font-bold text-slate-700 w-20 shrink-0">{formatThaiDateShort(rec.date)}</span>
                            <span className="px-2 py-0.5 rounded-full text-2xs font-bold border bg-teal-50 text-teal-800 border-teal-200">จัดยาประจำวัน</span>
                            <span className="text-slate-700 font-medium">IPD: <strong>{rec.ipdCount}</strong> | OPD: <strong>{rec.opdCount}</strong> | รวมจัดยา: <strong className="text-teal-700">{totStaff} ใบ</strong></span>
                          </div>
                          <button onClick={() => onSelectMonthAndView(entry.month, 'dispensing')} className="text-2xs text-teal-700 hover:underline font-semibold shrink-0 cursor-pointer">
                            เปิดเดือน {formatThaiMonthYear(entry.month)} ➔
                          </button>
                        </div>
                      );
                    }
                  })}
                </div>
              )}
            </div>
          </div>

          {/* Section 3: Auto-Save Snapshots */}
          <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
            <div className="px-5 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
              <div>
                <h3 className="text-sm font-bold text-slate-800 font-prompt">จุดบันทึกย้อนหลังอัตโนมัติ (Auto-Save Snapshots)</h3>
                <p className="text-2xs text-slate-500">ระบบสำรองจุดบันทึกให้อัตโนมัติเมื่อแก้ไขหรือก่อนล้างข้อมูล สามารถย้อนเวลากลับไปจุดเดิมได้ทันที</p>
              </div>
              <span className="text-xs font-bold px-2.5 py-0.5 rounded-full bg-indigo-100 text-indigo-800">{snapshots.length} จุดสำรอง</span>
            </div>
            <div className="p-4">
              {snapshots.length === 0 ? (
                <p className="text-center text-xs text-slate-400 py-8">ยังไม่มีจุดบันทึกสำรอง ระบบจะบันทึกให้อัตโนมัติเมื่อมีการแก้ไขข้อมูล หรือกดปุ่ม "📌 บันทึกจุดสำรองตอนนี้" ด้านบน</p>
              ) : (
                <div className="divide-y divide-slate-100 text-xs">
                  {snapshots.map(snap => (
                    <div key={snap.id} className="py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                      <div>
                        <div className="flex flex-wrap items-center gap-2">
                          <span className="font-bold text-slate-900">{formatDateTimeThai(snap.createdAt)}</span>
                          <span className="px-2 py-0.5 rounded-full text-2xs font-semibold bg-indigo-50 text-indigo-700 border border-indigo-200">{snap.label || 'บันทึกอัตโนมัติ'}</span>
                        </div>
                        <p className="text-2xs text-slate-500 mt-1">
                          จัดยา {snap.summary?.dispensingDays || 0} วัน • ตารางยา 4 กลุ่ม {snap.summary?.detailedCount || 0} รายการ • รายบุคคล(จัด/คีย์) {snap.summary?.matrixCount || 0}/{snap.summary?.keyingCount || 0} ครั้ง
                        </p>
                      </div>
                      {!isReadOnly && (
                        <div className="flex items-center gap-2 shrink-0">
                          <button onClick={() => onRestoreSnapshot(snap)} className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-2xs font-bold cursor-pointer">
                            🔄 กู้คืนจุดนี้
                          </button>
                          <button onClick={() => onDeleteSnapshot(snap.id)} className="px-2.5 py-1.5 text-rose-600 hover:bg-rose-50 rounded-xl text-2xs font-bold cursor-pointer">
                            ลบ
                          </button>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // VIEW 5: Settings & Drug Catalog
    // =========================================================================
    function SettingsView({ staffList, setStaffList, drugCatalog, setDrugCatalog, onClearAll }) {
      const [newStaffName, setNewStaffName] = useState('');
      const [newStaffShort, setNewStaffShort] = useState('');
      const [newDrugName, setNewDrugName] = useState('');
      const [drugSearch, setDrugSearch] = useState('');

      const handleAddStaff = (e) => {
        e.preventDefault();
        if (!newStaffName || !newStaffShort) return;
        setStaffList([...staffList, { id: `st-${Date.now()}`, fullName: newStaffName, shortName: newStaffShort, canDispense: true, canKey: false }]);
        setNewStaffName(''); setNewStaffShort('');
      };

      const handleAddDrug = (e) => {
        e.preventDefault();
        const trimmed = newDrugName.trim();
        if (!trimmed) return;
        if ((drugCatalog || []).some(d => d.name.toLowerCase() === trimmed.toLowerCase())) {
          alert(`มีรายการยา "${trimmed}" อยู่ในคลังแล้ว`);
          return;
        }
        setDrugCatalog([...(drugCatalog || []), { id: `drug-${Date.now()}`, name: trimmed }]);
        setNewDrugName('');
      };

      return (
        <div className="space-y-6 pb-10">
          {/* Drug Catalog Management */}
          <div className="bg-white rounded-2xl p-6 border border-slate-200 space-y-4">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <h3 className="font-bold font-prompt text-sm text-slate-800">คลังรายการยาสำหรับเลือกบันทึก ({(drugCatalog || []).length} รายการ)</h3>
                <p className="text-xs text-slate-500">เพิ่ม/ลบ ชื่อยา เพื่อใช้เลือกในแบบฟอร์มบันทึก 4 ตาราง</p>
              </div>
              <input
                type="text"
                placeholder="ค้นหาชื่อยา..."
                value={drugSearch}
                onChange={e => setDrugSearch(e.target.value)}
                className="border border-slate-200 px-3 py-1.5 rounded-xl text-xs w-full sm:w-60"
              />
            </div>

            <form onSubmit={handleAddDrug} className="flex flex-col sm:flex-row gap-2 text-xs">
              <input type="text" required placeholder="ชื่อยาใหม่ เช่น risperidone 1 mg, metformin 500 mg" value={newDrugName} onChange={e=>setNewDrugName(e.target.value)} className="flex-1 border p-2 rounded-xl" />
              <button type="submit" className="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl cursor-pointer">+ เพิ่มยา</button>
            </form>

            <div className="max-h-64 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">
              {(drugCatalog || [])
                .filter(d => !drugSearch.trim() || d.name.toLowerCase().includes(drugSearch.toLowerCase()))
                .map(d => (
                  <div key={d.id} className="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl flex justify-between items-center text-xs">
                    <p className="font-bold text-slate-800 truncate pr-2">{d.name}</p>
                    <button onClick={() => setDrugCatalog(drugCatalog.filter(x => x.id !== d.id))} className="text-rose-600 hover:underline shrink-0 cursor-pointer">ลบ</button>
                  </div>
                ))}
            </div>
          </div>

          <div className="bg-white rounded-2xl p-6 border border-slate-200">
            <h3 className="font-bold font-prompt text-sm mb-4">จัดการรายชื่อเจ้าหน้าที่ ({staffList.length} ท่าน)</h3>
            <div className="divide-y mb-4 text-xs">
              {staffList.map(s => (
                <div key={s.id} className="py-2 flex justify-between items-center">
                  <span><strong>{s.fullName}</strong> ({s.shortName})</span>
                  <button onClick={()=>setStaffList(staffList.filter(x=>x.id!==s.id))} className="text-rose-600 cursor-pointer">ลบ</button>
                </div>
              ))}
            </div>
            <form onSubmit={handleAddStaff} className="flex gap-2 text-xs">
              <input type="text" required placeholder="ชื่อ-สกุลเต็ม" value={newStaffName} onChange={e=>setNewStaffName(e.target.value)} className="border p-2 rounded-lg" />
              <input type="text" required placeholder="ชื่อย่อ" value={newStaffShort} onChange={e=>setNewStaffShort(e.target.value)} className="border p-2 rounded-lg w-28" />
              <button type="submit" className="px-4 py-2 bg-teal-600 text-white font-bold rounded-lg cursor-pointer">เพิ่ม</button>
            </form>
          </div>

          <div className="bg-white rounded-2xl p-6 border border-slate-200 flex justify-between items-center">
            <div><h4 className="font-bold text-sm">ล้างข้อมูล Mederror เป็น 0</h4><p className="text-xs text-slate-500">รีเซ็ตข้อมูลในเดือนนี้ให้เป็น 0</p></div>
            <button onClick={onClearAll} className="px-4 py-2 bg-rose-50 text-rose-700 border border-rose-200 rounded-xl text-xs font-bold cursor-pointer">ล้างข้อมูลเป็น 0</button>
          </div>
        </div>
      );
    }

    // Print Modal
    function PrintModal({ currentMonth, dispensingRecords, staffList, detailedErrors, onClose }) {
      const monthTitle = formatThaiMonthYear(currentMonth);
      const monthlyDetailed = detailedErrors.filter(e => e.date.startsWith(currentMonth));
      const wd = monthlyDetailed.filter(e => e.type === 'wrong_drug');
      const ws = monthlyDetailed.filter(e => e.type === 'wrong_strength');
      return (
        <div className="fixed inset-0 bg-slate-900/80 flex justify-center p-4 z-50 overflow-y-auto">
          <div className="bg-white rounded-2xl max-w-4xl w-full my-6 overflow-hidden flex flex-col shadow-2xl">
            <div className="bg-slate-800 text-white px-6 py-3 flex justify-between items-center no-print">
              <span className="font-bold text-sm">พิมพ์รายงานสรุปประจำเดือน</span>
              <div className="flex gap-2">
                <button onClick={() => window.print()} className="px-4 py-1.5 bg-teal-500 text-white font-bold text-xs rounded-lg cursor-pointer">สั่งพิมพ์</button>
                <button onClick={onClose} className="px-3 py-1.5 bg-slate-700 text-white text-xs rounded-lg cursor-pointer">ปิด</button>
              </div>
            </div>
            <div className="p-8 text-slate-900 space-y-4 text-xs bg-white">
              <h2 className="text-center text-base font-bold font-prompt">รายงานสรุป Mederror ห้องยา ประจำเดือน {monthTitle}</h2>
              <p className="text-center text-slate-600">
                1. จัดยาผิดชนิด: {wd.length} | 2. จัดยาไม่ครบจำนวน: {monthlyDetailed.filter(e=>e.type==='incomplete_qty').length} | 3. ไม่ครบในตะกร้า: {monthlyDetailed.filter(e=>e.type==='incomplete_basket').length} | 4. จัดยาผิดความแรง: {ws.length}
              </p>
              <h3 className="font-bold text-xs">1. รายการจัดยาผิดชนิด ({wd.length} ครั้ง)</h3>
              <table className="w-full text-left border-collapse border border-slate-400 text-2xs">
                <thead><tr className="bg-slate-100"><th className="p-1.5 border">วันที่</th><th className="p-1.5 border">รายการยาที่ต้องการ</th><th className="p-1.5 border">ความคลาดเคลื่อน (ยาที่จัดผิด)</th></tr></thead>
                <tbody>
                  {wd.length === 0 ? <tr><td colSpan={3} className="p-2 text-center text-slate-400">ไม่มีรายการ (0)</td></tr> : wd.map(i=><tr key={i.id}><td className="p-1 border">{formatThaiDateShort(i.date)}</td><td className="p-1 border">{i.targetDrug}</td><td className="p-1 border">{i.errorDrug}</td></tr>)}
                </tbody>
              </table>
              <h3 className="font-bold text-xs pt-2">4. รายการจัดยาผิดความแรง ({ws.length} ครั้ง)</h3>
              <table className="w-full text-left border-collapse border border-slate-400 text-2xs">
                <thead><tr className="bg-slate-100"><th className="p-1.5 border">วันที่</th><th className="p-1.5 border">รายการยาที่ต้องการ</th><th className="p-1.5 border">ความคลาดเคลื่อน (ความแรงที่จัดผิด)</th></tr></thead>
                <tbody>
                  {ws.length === 0 ? <tr><td colSpan={3} className="p-2 text-center text-slate-400">ไม่มีรายการ (0)</td></tr> : ws.map(i=><tr key={i.id}><td className="p-1 border">{formatThaiDateShort(i.date)}</td><td className="p-1 border">{i.targetDrug}</td><td className="p-1 border">{i.errorDrug}</td></tr>)}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    function ShareModalHtml({ allState, currentMonth, onClose }) {
      const [snapshotUrl, setSnapshotUrl] = useState('');
      const [liveUrl, setLiveUrl] = useState('');
      const [copied, setCopied] = useState('');

      useEffect(() => {
        (async () => {
          const token = await encodeHtmlSharePayload(allState, currentMonth);
          const u1 = new URL(window.location.href);
          u1.searchParams.set('mode', 'executive');
          u1.hash = `share=${token}`;
          setSnapshotUrl(u1.toString());

          const u2 = new URL(window.location.href);
          u2.hash = '';
          u2.searchParams.set('mode', 'executive');
          setLiveUrl(u2.toString());
        })();
      }, [allState, currentMonth]);

      const copyUrl = async (txt, key) => {
        try { await navigator.clipboard.writeText(txt); } catch {}
        setCopied(key);
        setTimeout(() => setCopied(''), 2000);
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-2xl max-w-2xl w-full shadow-2xl border border-slate-200 overflow-hidden">
            <div className="px-5 py-4 bg-gradient-to-r from-teal-700 to-emerald-700 text-white flex justify-between items-center">
              <div>
                <h3 className="text-sm font-bold font-prompt">🔗 แชร์ลิงก์ให้ผู้บริหารดูออนไลน์ (Read-Only)</h3>
                <p className="text-2xs text-teal-100">เปิดดูแดชบอร์ด ตาราง 4 กลุ่ม รายบุคคล และประวัติย้อนหลังได้โดยไม่แก้ไขข้อมูล</p>
              </div>
              <button onClick={onClose} className="px-2.5 py-1 bg-white/15 hover:bg-white/25 rounded-lg text-xs font-bold cursor-pointer">ปิด</button>
            </div>
            <div className="p-5 space-y-4 text-xs">
              <div className="rounded-xl border border-teal-200 bg-teal-50/40 p-4 space-y-2">
                <p className="font-bold text-slate-800">แบบที่ 1: ลิงก์แชร์ข้อมูลทันที (Snapshot Link — ใช้ได้บน Netlify / GitHub Pages)</p>
                <div className="flex gap-2">
                  <input type="text" readOnly value={snapshotUrl || 'กำลังสร้างลิงก์...'} className="flex-1 px-3 py-2 bg-white border border-slate-300 rounded-xl text-2xs font-mono" />
                  <button onClick={() => copyUrl(snapshotUrl, 'snap')} className="px-3.5 py-2 bg-teal-600 text-white rounded-xl font-bold cursor-pointer shrink-0">
                    {copied === 'snap' ? 'คัดลอกแล้ว ✓' : 'คัดลอกลิงก์'}
                  </button>
                </div>
                {snapshotUrl && (
                  <a href={snapshotUrl} target="_blank" rel="noreferrer" className="inline-block text-2xs font-bold text-emerald-700 hover:underline">
                    ↗ ทดลองเปิดดูโหมดผู้บริหารในแท็บใหม่
                  </a>
                )}
              </div>
              <div className="rounded-xl border border-indigo-200 bg-indigo-50/40 p-4 space-y-2">
                <p className="font-bold text-slate-800">แบบที่ 2: ลิงก์ดูข้อมูลสด (Cloud Server Live Link)</p>
                <div className="flex gap-2">
                  <input type="text" readOnly value={liveUrl} className="flex-1 px-3 py-2 bg-white border border-slate-300 rounded-xl text-2xs font-mono" />
                  <button onClick={() => copyUrl(liveUrl, 'live')} className="px-3.5 py-2 bg-indigo-600 text-white rounded-xl font-bold cursor-pointer shrink-0">
                    {copied === 'live' ? 'คัดลอกแล้ว ✓' : 'คัดลอกลิงก์'}
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
