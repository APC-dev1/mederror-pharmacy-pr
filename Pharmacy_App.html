    // --- Chart.js React Wrapper Component ---
    function ChartBox({ type, data, options, height = '240px' }) {
      const canvasRef = useRef(null);
      const chartInstanceRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current || !window.Chart) return;
        if (chartInstanceRef.current) {
          chartInstanceRef.current.destroy();
        }
        chartInstanceRef.current = new window.Chart(canvasRef.current, {
          type,
          data,
          options: {
            responsive: true,
            maintainAspectRatio: false,
            ...options
          }
        });
        return () => {
          if (chartInstanceRef.current) {
            chartInstanceRef.current.destroy();
          }
        };
      }, [type, JSON.stringify(data), JSON.stringify(options)]);

      return (
        <div style={{ height, position: 'relative', width: '100%' }}>
          <canvas ref={canvasRef}></canvas>
        </div>
      );
    }

    // --- Auto-Save & Snapshot Helpers (IndexedDB + localStorage fallback + File System API) ---
    const HTML_DB_NAME = 'MederrorPharmacyHtmlDB';
    const HTML_SNAP_LS = 'app_med_snapshots_v4';
    let htmlDbPromise = null;

    function openHtmlDb() {
      if (typeof indexedDB === 'undefined') return Promise.resolve(null);
      if (htmlDbPromise) return htmlDbPromise;
      htmlDbPromise = new Promise((resolve) => {
        try {
          const req = indexedDB.open(HTML_DB_NAME, 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('state')) db.createObjectStore('state', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('snapshots')) db.createObjectStore('snapshots', { keyPath: 'id' });
          };
          req.onsuccess = (e) => resolve(e.target.result);
          req.onerror = () => resolve(null);
        } catch { resolve(null); }
      });
      return htmlDbPromise;
    }

    async function mirrorHtmlStateToIdb(allState) {
      const db = await openHtmlDb();
      if (!db) return false;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction('state', 'readwrite');
          tx.objectStore('state').put({ id: 'latest', updatedAt: new Date().toISOString(), data: allState });
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        } catch { resolve(false); }
      });
    }

    async function loadHtmlMirrorFromIdb() {
      const db = await openHtmlDb();
      if (!db) return null;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction('state', 'readonly');
          const req = tx.objectStore('state').get('latest');
          req.onsuccess = () => resolve(req.result?.data || null);
          req.onerror = () => resolve(null);
        } catch { resolve(null); }
      });
    }

    async function saveHtmlSnapshot(allState, label = 'บันทึกอัตโนมัติ') {
      const snap = {
        id: `snap-${Date.now()}-${Math.random().toString(36).slice(2, 5)}`,
        createdAt: new Date().toISOString(),
        label,
        summary: {
          dispensingDays: allState.dispensing?.length || 0,
          detailedCount: allState.detailedErrors?.length || 0,
          matrixCount: allState.staffMatrixErrors?.length || 0,
          keyingCount: allState.keyingErrors?.length || 0
        },
        data: JSON.parse(JSON.stringify(allState))
      };

      const db = await openHtmlDb();
      if (db) {
        await new Promise((resolve) => {
          try {
            const tx = db.transaction('snapshots', 'readwrite');
            const store = tx.objectStore('snapshots');
            store.put(snap);
            const allReq = store.getAll();
            allReq.onsuccess = () => {
              const all = (allReq.result || []).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
              all.slice(25).forEach(old => store.delete(old.id));
            };
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
          } catch { resolve(false); }
        });
      }

      try {
        const raw = localStorage.getItem(HTML_SNAP_LS);
        const list = raw ? JSON.parse(raw) : [];
        localStorage.setItem(HTML_SNAP_LS, JSON.stringify([snap, ...list].slice(0, 10)));
      } catch {}
      return snap;
    }

    async function listHtmlSnapshots() {
      const db = await openHtmlDb();
      if (db) {
        const idbList = await new Promise((resolve) => {
          try {
            const tx = db.transaction('snapshots', 'readonly');
            const req = tx.objectStore('snapshots').getAll();
            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => resolve([]);
          } catch { resolve([]); }
        });
        if (idbList.length > 0) return idbList.sort((a, b) => b.createdAt.localeCompare(a.createdAt));
      }
      try {
        const raw = localStorage.getItem(HTML_SNAP_LS);
        const list = raw ? JSON.parse(raw) : [];
        return list.sort((a, b) => b.createdAt.localeCompare(a.createdAt));
      } catch { return []; }
    }

    async function deleteHtmlSnapshotById(id) {
      const db = await openHtmlDb();
      if (db) {
        await new Promise((resolve) => {
          try {
            const tx = db.transaction('snapshots', 'readwrite');
            tx.objectStore('snapshots').delete(id);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
          } catch { resolve(false); }
        });
      }
      try {
        const raw = localStorage.getItem(HTML_SNAP_LS);
        if (raw) {
          localStorage.setItem(HTML_SNAP_LS, JSON.stringify(JSON.parse(raw).filter(s => s.id !== id)));
        }
      } catch {}
    }

    function formatDateTimeThai(isoStr) {
      if (!isoStr) return '-';
      try {
        const d = new Date(isoStr);
        return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()+543} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
      } catch { return isoStr; }
    }

    // --- Executive Share Link Helpers ---
    function uint8ToB64Url(bytes) {
      let binary = '';
      for (let i = 0; i < bytes.length; i += 0x8000) {
        binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
      }
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    function b64UrlToUint8(b64url) {
      const b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
      const pad = b64.length % 4 === 0 ? '' : '='.repeat(4 - (b64.length % 4));
      const bin = atob(b64 + pad);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }
    async function encodeHtmlSharePayload(allState, currentMonth) {
      const jsonBytes = new TextEncoder().encode(JSON.stringify({ v: 1, exportedAt: new Date().toISOString(), currentMonth, data: allState }));
      if (typeof CompressionStream !== 'undefined') {
        const cs = new CompressionStream('gzip');
        const w = cs.writable.getWriter();
        w.write(jsonBytes); w.close();
        const buf = await new Response(cs.readable).arrayBuffer();
        return 'gz.' + uint8ToB64Url(new Uint8Array(buf));
      }
      return 'raw.' + uint8ToB64Url(jsonBytes);
    }
    async function decodeHtmlSharePayload(hashStr) {
      const rawHash = (hashStr || '').replace(/^#/, '');
      if (!rawHash.startsWith('share=')) return null;
      const token = rawHash.slice(6).split('&')[0];
      if (!token) return null;
      let txt = '';
      if (token.startsWith('gz.')) {
        const ds = new DecompressionStream('gzip');
        const w = ds.writable.getWriter();
        w.write(b64UrlToUint8(token.slice(3))); w.close();
        txt = new TextDecoder().decode(await new Response(ds.readable).arrayBuffer());
      } else if (token.startsWith('raw.')) {
        txt = new TextDecoder().decode(b64UrlToUint8(token.slice(4)));
      } else {
        throw new Error('รูปแบบลิงก์แชร์ไม่ถูกต้อง');
      }
      return JSON.parse(txt);
    }

      const prevStateRef = useRef(null);
      const lastSnapTimeRef = useRef(0);
      const lastFpRef = useRef('');

      const applyStateSnapshot = (data) => {
        if (!data) return;
        if (data.staff) setStaffList(data.staff);
        if (data.drugCatalog) setDrugCatalog(data.drugCatalog);
        if (data.dispensing) setDispensingRecords(data.dispensing);
        if (data.detailedErrors) setDetailedErrors(data.detailedErrors);
        if (data.staffMatrixErrors) setStaffMatrixErrors(data.staffMatrixErrors);
        if (data.keyingErrors) setKeyingErrors(data.keyingErrors);
      };

      // Initial IndexedDB recovery or Executive Share load
      useEffect(() => {
        if (isExecutiveMode && hasShareHash) {
          (async () => {
            try {
              const payload = await decodeHtmlSharePayload(window.location.hash);
              if (payload?.data) {
                applyStateSnapshot(payload.data);
                if (payload.currentMonth) setCurrentMonth(payload.currentMonth);
                setSharedMeta({ exportedAt: payload.exportedAt || '', error: '' });
              }
            } catch (err) {
              setSharedMeta({ exportedAt: '', error: err?.message || 'ไม่สามารถอ่านข้อมูลจากลิงก์แชร์ได้' });
            }
          })();
          return;
        }

        const hasLs = Boolean(localStorage.getItem('app_med_disp_v4') || localStorage.getItem('app_med_detailed_v4'));
        (async () => {
          if (!hasLs) {
            const recovered = await loadHtmlMirrorFromIdb();
            if (recovered && (recovered.dispensing || recovered.detailedErrors)) {
              applyStateSnapshot(recovered);
            }
          }
          setSnapshots(await listHtmlSnapshots());
        })();
      }, [isExecutiveMode, hasShareHash]);

      useEffect(() => {
        if (!isExecutiveMode) {
          localStorage.setItem('app_med_month_v4', currentMonth);
        }
      }, [currentMonth, isExecutiveMode]);

      // Multi-layer Auto-Save on every edit (disabled in Executive Read-Only Mode)
      useEffect(() => {
        if (isExecutiveMode) return;
        const allState = { staff: staffList, drugCatalog, dispensing: dispensingRecords, detailedErrors, staffMatrixErrors, keyingErrors };
        localStorage.setItem('app_med_staff_v4', JSON.stringify(staffList));
        localStorage.setItem('app_med_drugs_v4', JSON.stringify(drugCatalog));
        localStorage.setItem('app_med_disp_v4', JSON.stringify(dispensingRecords));
        localStorage.setItem('app_med_detailed_v4', JSON.stringify(detailedErrors));
        localStorage.setItem('app_med_matrix_v4', JSON.stringify(staffMatrixErrors));
        localStorage.setItem('app_med_keying_v4', JSON.stringify(keyingErrors));
        setLastSavedAt(new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));

        const prev = prevStateRef.current;
        const prevTot = (prev?.detailedErrors?.length||0)+(prev?.dispensing?.length||0)+(prev?.staffMatrixErrors?.length||0)+(prev?.keyingErrors?.length||0);
        const nextTot = detailedErrors.length + dispensingRecords.length + staffMatrixErrors.length + keyingErrors.length;
        const droppedSharply = prev && (prevTot - nextTot >= 3 || (prevTot > 0 && nextTot === 0));

        const fp = getHtmlFingerprint(allState);
        const now = Date.now();
        (async () => {
          if (droppedSharply && prev) {
            await saveHtmlSnapshot(prev, 'สำรองอัตโนมัติก่อนล้างข้อมูล');
            lastSnapTimeRef.current = now;
            lastFpRef.current = fp;
            setSnapshots(await listHtmlSnapshots());
          } else if (fp !== lastFpRef.current && (now - lastSnapTimeRef.current > 2 * 60 * 1000 || lastSnapTimeRef.current === 0)) {
            await saveHtmlSnapshot(allState, 'บันทึกอัตโนมัติ');
            lastSnapTimeRef.current = now;
            lastFpRef.current = fp;
            setSnapshots(await listHtmlSnapshots());
          }
          prevStateRef.current = allState;
          await mirrorHtmlStateToIdb(allState);
          if (autoFileHandleRef.current) {
            try {
              const writable = await autoFileHandleRef.current.createWritable();
              await writable.write(JSON.stringify({ exportedAt: new Date().toISOString(), ...allState }, null, 2));
              await writable.close();
            } catch {}
          }
        })();
      }, [staffList, drugCatalog, dispensingRecords, detailedErrors, staffMatrixErrors, keyingErrors]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const currentAllState = { staff: staffList, drugCatalog, dispensing: dispensingRecords, detailedErrors, staffMatrixErrors, keyingErrors };

      const handleClearAllToZero = async () => {
        if (confirm(`ยืนยันการล้างข้อมูล Mederror ประจำเดือน ${formatThaiMonthYear(currentMonth)} ให้เป็น 0 ทั้งหมดหรือไม่? (ระบบจะสำรองจุดเดิมไว้ในประวัติย้อนหลังให้)`)) {
          await saveHtmlSnapshot(currentAllState, `ก่อนล้างข้อมูลเดือน ${formatThaiMonthYear(currentMonth)}`);
          setDetailedErrors(prev => prev.filter(e => !e.date.startsWith(currentMonth)));
          setStaffMatrixErrors(prev => prev.filter(e => !e.date.startsWith(currentMonth)));
          setKeyingErrors(prev => prev.filter(k => !k.date.startsWith(currentMonth)));
          setSnapshots(await listHtmlSnapshots());
        }
      };

      const handleCreateManualSnapshot = async () => {
        await saveHtmlSnapshot(currentAllState, 'บันทึกโดยผู้ใช้');
        setSnapshots(await listHtmlSnapshots());
        alert('บันทึกจุดสำรองย้อนหลังเรียบร้อยแล้ว');
      };

      const handleRestoreSnapshot = async (snap) => {
        if (!snap?.data) return;
        if (!confirm('ยืนยันการกู้คืนข้อมูลกลับไปยังจุดบันทึกนี้หรือไม่? (ระบบจะสำรองข้อมูลปัจจุบันเก็บไว้ให้ก่อน)')) return;
        await saveHtmlSnapshot(currentAllState, 'ก่อนกู้คืนข้อมูลย้อนหลัง');
        applyStateSnapshot(snap.data);
        setSnapshots(await listHtmlSnapshots());
      };

      const handleDeleteSnapshot = async (id) => {
        await deleteHtmlSnapshotById(id);
        setSnapshots(await listHtmlSnapshots());
      };

      const handlePickAutoBackupFile = async () => {
        if (typeof window.showSaveFilePicker !== 'function') return;
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: 'mederror_autosave_backup.json',
            types: [{ description: 'JSON Backup File', accept: { 'application/json': ['.json'] } }]
          });
          autoFileHandleRef.current = handle;
          setAutoBackupFileName(handle.name);
          const writable = await handle.createWritable();
          await writable.write(JSON.stringify({ exportedAt: new Date().toISOString(), ...currentAllState }, null, 2));
          await writable.close();
        } catch {}
      };

      const handleDownloadJsonBackup = () => {
        const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify({ exportedAt: new Date().toISOString(), ...currentAllState }, null, 2));
        const a = document.createElement('a');
        a.setAttribute('href', dataStr);
        a.setAttribute('download', `mederror_backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(a);
        a.click();
        a.remove();
      };

      const handleImportJsonBackup = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (parsed.staff && (parsed.dispensing || parsed.detailedErrors)) {
              await saveHtmlSnapshot(currentAllState, 'ก่อนนำเข้าไฟล์สำรอง (.json)');
              applyStateSnapshot(parsed);
              setSnapshots(await listHtmlSnapshots());
              alert('นำเข้าข้อมูลย้อนหลังสำเร็จ');
            } else {
              alert('รูปแบบไฟล์ JSON ไม่ถูกต้อง');
            }
          } catch { alert('เกิดข้อผิดพลาดในการอ่านไฟล์สำรองข้อมูล'); }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const handleExportExcel = (targetMonth = currentMonth) => {
        const m = typeof targetMonth === 'string' ? targetMonth : currentMonth;
        const wb = XLSX.utils.book_new();
        const monthTitle = formatThaiMonthYear(m);
        const activeStaff = staffList.filter(s => s.canDispense);

        const monthlyDisp = dispensingRecords.filter(r => r.date.startsWith(m)).sort((a,b) => a.date.localeCompare(b.date));
        const monthlyDetailed = detailedErrors.filter(e => e.date.startsWith(m));
        const monthlyMatrix = staffMatrixErrors.filter(e => e.date.startsWith(m));
        const wrongDrugList = monthlyDetailed.filter(e => e.type === 'wrong_drug');
        const wrongStrengthList = monthlyDetailed.filter(e => e.type === 'wrong_strength');
        const incompleteQtyList = monthlyDetailed.filter(e => e.type === 'incomplete_qty');
        const incompleteBasketList = monthlyDetailed.filter(e => e.type === 'incomplete_basket');

        // 1. 1.จัดยาผิดชนิด
        const wdHeaders = ['วันที่', 'รายการยาที่ต้องการ', 'ความคลาดเคลื่อน (ยาที่จัดผิด)', 'ประเภทความผิด'];
        const wdRows = wrongDrugList.map(i => {
          const sub = i.subType === 'wrong_strength' ? 'ผิดความแรง' : i.subType === 'wrong_mix' ? 'ยาผสม' : 'ผิดชนิดตัวยา';
          return [formatThaiDateShort(i.date), i.targetDrug, i.errorDrug, sub];
        });
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([[`1. ตารางจัดยาผิดชนิด เดือน ${monthTitle}`], [], wdHeaders, ...wdRows]), '1.จัดยาผิดชนิด');

        // 2. 2.จัดยาไม่ครบจำนวน
        const iqHeaders = ['วันที่', 'ชื่อยา', 'จำนวน (ที่ต้องการ)', 'ความคลาดเคลื่อน'];
        const iqRows = incompleteQtyList.map(i => [
          formatThaiDateShort(i.date), i.drugName, i.targetQty, i.errorQty
        ]);
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([[`2. ตารางจัดยาไม่ครบจำนวน เดือน ${monthTitle}`], [], iqHeaders, ...iqRows]), '2.จัดยาไม่ครบจำนวน');

        // 3. 3.จัดยาไม่ครบในตะกร้า
        const ibHeaders = ['วันที่', 'จัดยาไม่ครบจำนวน (ยาในตะกร้า)', 'จำนวนที่ขาด'];
        const ibRows = incompleteBasketList.map(i => [
          formatThaiDateShort(i.date), i.drugName, i.missingCount || 1
        ]);
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([[`3. ตารางจัดยาไม่ครบในตะกร้า เดือน ${monthTitle}`], [], ibHeaders, ...ibRows]), '3.จัดยาไม่ครบในตะกร้า');

        // 4. 4.จัดยาผิดความแรง
        const wsHeaders = ['วันที่', 'รายการยาที่ต้องการ', 'ความคลาดเคลื่อน (ความแรงที่จัดผิด)'];
        const wsRows = wrongStrengthList.map(i => [
          formatThaiDateShort(i.date), i.targetDrug, i.errorDrug
        ]);
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([[`4. ตารางจัดยาผิดความแรง เดือน ${monthTitle}`], [], wsHeaders, ...wsRows]), '4.จัดยาผิดความแรง');

        // 5. ภาระงานจัดยา
        const dispHeaders = ['วันที่', 'IPD', 'OPD', 'รวมคนไข้', ...activeStaff.map(s => s.shortName), 'รวมจัดยา'];
        const dispRows = monthlyDisp.map(r => {
          let sTot = 0;
          const cols = activeStaff.map(s => {
            const v = Number(r.staffCounts?.[s.id]) || 0;
            sTot += v;
            return v;
          });
          return [formatThaiDateShort(r.date), r.ipdCount, r.opdCount, (Number(r.ipdCount)||0)+(Number(r.opdCount)||0), ...cols, sTot];
        });
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([[`รายงานการจัดยา เดือน ${monthTitle}`], [], dispHeaders, ...dispRows]), 'ภาระงานจัดยา');

        // 6. Matrix การจัดยารายบุคคล
        const dispTypes = errorTypes.dispensing || [];
        const mHeaders = ['ชื่อ', ...dispTypes.map(t => t.name), 'รวม'];
        const mRows = activeStaff.map(s => {
          const cols = dispTypes.map(t => monthlyMatrix.filter(i => i.staffId === s.id && i.errorTypeId === t.id).length);
          const rowTot = cols.reduce((acc, c) => acc + c, 0);
          return [s.fullName, ...cols, rowTot];
        });
        mRows.push(['รวม', ...dispTypes.map(t => monthlyMatrix.filter(i => i.errorTypeId === t.id).length), monthlyMatrix.length]);
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([[`สรุป Mederror การจัดยา เดือน ${monthTitle}`], [], mHeaders, ...mRows]), 'Mederror_รายบุคคล');

        XLSX.writeFile(wb, `รายงานห้องยา_Mederror_${m}.xlsx`);
      };

      const handleExportAllHistoryExcel = () => {
        const wb = XLSX.utils.book_new();
        const activeStaff = staffList.filter(s => s.canDispense);
        const mSet = new Set();
        dispensingRecords.forEach(r => r.date && mSet.add(r.date.slice(0,7)));
        detailedErrors.forEach(e => e.date && mSet.add(e.date.slice(0,7)));
        staffMatrixErrors.forEach(x => x.date && mSet.add(x.date.slice(0,7)));
        keyingErrors.forEach(k => k.date && mSet.add(k.date.slice(0,7)));
        const months = Array.from(mSet).sort();

        const sumHeaders = ['เดือน/ปี', 'วันบันทึก', 'ผู้ป่วยรวม', 'ยอดจัดยา', 'ผิดชนิด', 'ไม่ครบจำนวน', 'ไม่ครบตะกร้า', 'ผิดความแรง', 'รวม Mederror ยา', 'รายบุคคล(จัด/คีย์)'];
        const sumRows = months.map(m => {
          const disp = dispensingRecords.filter(r => r.date.startsWith(m));
          const det = detailedErrors.filter(e => e.date.startsWith(m));
          const mat = staffMatrixErrors.filter(x => x.date.startsWith(m));
          const key = keyingErrors.filter(k => k.date.startsWith(m));
          let totP = 0, totD = 0;
          disp.forEach(r => { totP += (Number(r.ipdCount)||0)+(Number(r.opdCount)||0); Object.values(r.staffCounts||{}).forEach(v => totD += Number(v)||0); });
          return [formatThaiMonthYear(m), disp.length, totP, totD, det.filter(i=>i.type==='wrong_drug').length, det.filter(i=>i.type==='incomplete_qty').length, det.filter(i=>i.type==='incomplete_basket').length, det.filter(i=>i.type==='wrong_strength').length, det.length, `${mat.length}/${key.length}`];
        });
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['สรุปข้อมูลย้อนหลังทุกเดือน ห้องยา'], [], sumHeaders, ...sumRows]), 'สรุปย้อนหลังทุกเดือน');

        const sortedDisp = [...dispensingRecords].sort((a,b) => a.date.localeCompare(b.date));
        const dHeaders = ['วันที่', 'เดือน', 'IPD', 'OPD', 'รวมคนไข้', ...activeStaff.map(s => s.shortName), 'รวมจัดยา'];
        const dRows = sortedDisp.map(r => {
          let totD = 0;
          const cols = activeStaff.map(s => { const v = Number(r.staffCounts?.[s.id])||0; totD+=v; return v; });
          return [formatThaiDateShort(r.date), formatThaiMonthYear(r.date.slice(0,7)), r.ipdCount, r.opdCount, (Number(r.ipdCount)||0)+(Number(r.opdCount)||0), ...cols, totD];
        });
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['ประวัติการจัดยาประจำวันทั้งหมด'], [], dHeaders, ...dRows]), 'จัดยาประจำวัน_ทั้งหมด');

        const sortedDet = [...detailedErrors].sort((a,b) => a.date.localeCompare(b.date));
        const typeTxt = { wrong_drug: '1. จัดยาผิดชนิด', incomplete_qty: '2. ไม่ครบจำนวน', incomplete_basket: '3. ไม่ครบในตะกร้า', wrong_strength: '4. ผิดความแรง' };
        const eHeaders = ['วันที่', 'เดือน', 'หมวดหมู่', 'รายการยา/ชื่อยา', 'ความคลาดเคลื่อน'];
        const eRows = sortedDet.map(i => [
          formatThaiDateShort(i.date), formatThaiMonthYear(i.date.slice(0,7)), typeTxt[i.type]||i.type, i.targetDrug||i.drugName||'-',
          i.errorDrug || (i.type==='incomplete_qty' ? `${i.targetQty} -> ${i.errorQty}` : `ขาด ${i.missingCount||1} รายการ`)
        ]);
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['ประวัติ Mederror ยาทั้งหมด'], [], eHeaders, ...eRows]), 'Mederror_ทั้งหมด');

        XLSX.writeFile(wb, `ประวัติข้อมูลห้องยา_ย้อนหลังทั้งหมด.xlsx`);
      };

      // Generate Dynamic Year List (2566-2572 + any year found in records)
      const [curYr, curMo] = currentMonth.split('-').map(Number);
      const yrSet = new Set([2023, 2024, 2025, 2026, 2027, 2028, 2029, curYr]);
      dispensingRecords.forEach(r => r.date && yrSet.add(Number(r.date.slice(0,4))));
      detailedErrors.forEach(e => e.date && yrSet.add(Number(e.date.slice(0,4))));
      const yearOptions = Array.from(yrSet).filter(Boolean).sort((a,b) => a - b);

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs no-print">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-teal-600 to-emerald-500 flex items-center justify-center text-white shadow-md">
                  <i data-lucide="pill" className="w-6 h-6"></i>
                </div>
                <div>
                  <h1 className="text-lg font-bold font-prompt text-slate-800 leading-tight">ระบบบันทึกการจัดยา & Mederror ห้องยา</h1>
                  <p className="text-xs text-slate-500">แยก 4 ตาราง + บันทึกอัตโนมัติ + เรียกดูข้อมูลย้อนหลัง + แดชบอร์ดรายบุคคล</p>
                </div>
              </div>

              <div className="flex items-center flex-wrap gap-2">
                {isExecutiveMode ? (
                  <span className="px-2.5 py-1.5 text-2xs font-bold text-indigo-800 bg-indigo-50 border border-indigo-200 rounded-xl flex items-center gap-1">
                    👁️ โหมดผู้บริหาร (ดูอย่างเดียว)
                  </span>
                ) : (
                  <button
                    onClick={() => setActiveTab('history')}
                    className="px-2.5 py-1.5 text-2xs font-bold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 rounded-xl cursor-pointer flex items-center gap-1"
                    title="ระบบบันทึกข้อมูลอัตโนมัติ • คลิกเพื่อดูประวัติย้อนหลัง"
                  >
                    <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span>บันทึกอัตโนมัติ {lastSavedAt}</span>
                  </button>
                )}

                <div className="flex items-center bg-slate-100 rounded-xl p-1 border border-slate-200 text-xs font-medium">
                  <span className="px-2 text-slate-500">เดือน:</span>
                  <select 
                    value={curMo} 
                    onChange={e => setCurrentMonth(`${curYr}-${String(e.target.value).padStart(2,'0')}`)}
                    className="bg-white rounded-lg px-2 py-1 border border-slate-200 font-semibold text-slate-700 cursor-pointer"
                  >
                    {THAI_MONTHS_FULL.map((m, idx) => <option key={idx+1} value={idx+1}>{m}</option>)}
                  </select>
                  <select 
                    value={curYr} 
                    onChange={e => setCurrentMonth(`${e.target.value}-${String(curMo).padStart(2,'0')}`)}
                    className="bg-white rounded-lg px-2 py-1 border border-slate-200 font-semibold text-slate-700 ml-1 cursor-pointer"
                  >
                    {yearOptions.map(y => <option key={y} value={y}>พ.ศ. {y+543}</option>)}
                  </select>
                </div>

                {!isExecutiveMode && (
                  <button
                    onClick={() => setIsShareOpen(true)}
                    className="px-3 py-1.5 text-xs font-semibold text-indigo-700 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 rounded-xl transition-all cursor-pointer flex items-center gap-1.5"
                    title="สร้างลิงก์ออนไลน์ให้ผู้บริหารเปิดดูได้ทุกที่ทุกเวลา"
                  >
                    <span>🔗 แชร์ผู้บริหาร</span>
                  </button>
                )}

                <button 
                  onClick={() => handleExportExcel(currentMonth)}
                  className="px-3 py-1.5 text-xs font-semibold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 rounded-xl transition-all cursor-pointer flex items-center gap-1.5"
                >
                  <i data-lucide="file-spreadsheet" className="w-4 h-4 text-emerald-600"></i>
                  <span>ส่งออก Excel</span>
                </button>

                <button 
                  onClick={() => setIsPrintOpen(true)}
                  className="px-3 py-1.5 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 border border-slate-200 rounded-xl transition-all cursor-pointer flex items-center gap-1.5"
                >
                  <i data-lucide="printer" className="w-4 h-4 text-slate-600"></i>
                  <span>พิมพ์รายงาน</span>
                </button>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="max-w-7xl mx-auto px-4 flex gap-1 border-t border-slate-100 pt-2 pb-1 overflow-x-auto">
              {[
                { id: 'detailed_tables', label: '📝 บันทึกแยก 4 ตาราง (ผิดชนิด / ไม่ครบ / ตะกร้า / ผิดความแรง)' },
                { id: 'dashboard', label: '📊 แดชบอร์ด & สรุป Mederror รายบุคคล' },
                { id: 'mederror', label: '⚠️ บันทึก Mederror รายบุคคล' },
                { id: 'dispensing', label: '📋 บันทึกจัดยาประจำวัน' },
                { id: 'history', label: '📜 ข้อมูลย้อนหลัง & สำรอง' },
                ...(!isExecutiveMode ? [{ id: 'settings', label: '👥 เจ้าหน้าที่ & ตั้งค่า' }] : [])
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`px-4 py-2 text-xs font-bold rounded-xl transition-all cursor-pointer whitespace-nowrap ${
                    activeTab === tab.id ? 'bg-teal-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>
          </header>

          {isExecutiveMode && (
            <div className="bg-indigo-600 text-white text-xs py-2 px-4 no-print">
              <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
                <div className="flex items-center gap-2">
                  <span className="px-2 py-0.5 bg-white/20 rounded-full font-bold text-2xs">EXECUTIVE READ-ONLY</span>
                  <span>
                    กำลังแสดงข้อมูลสำหรับผู้บริหาร (ดูอย่างเดียว)
                    {sharedMeta.exportedAt ? ` • อัปเดต ณ ${new Date(sharedMeta.exportedAt).toLocaleString('th-TH')}` : ''}
                  </span>
                </div>
                {sharedMeta.error && <span className="bg-rose-500 px-2 py-0.5 rounded-full text-2xs font-bold">{sharedMeta.error}</span>}
              </div>
            </div>
          )}

          <main className="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
            {activeTab === 'detailed_tables' && (
              <DetailedTablesView 
                currentMonth={currentMonth}
                detailedErrors={detailedErrors}
                setDetailedErrors={setDetailedErrors}
                drugCatalog={drugCatalog}
                setDrugCatalog={setDrugCatalog}
                onClearAll={handleClearAllToZero}
                isReadOnly={isExecutiveMode}
              />
            )}

            {activeTab === 'dashboard' && (
              <DashboardView 
                currentMonth={currentMonth}
                dispensingRecords={dispensingRecords}
                staffList={staffList}
                errorTypes={errorTypes}
                detailedErrors={detailedErrors}
                staffMatrixErrors={staffMatrixErrors}
                keyingErrors={keyingErrors}
              />
            )}

            {activeTab === 'mederror' && (
              <MederrorMatrixView 
                currentMonth={currentMonth}
                staffMatrixErrors={staffMatrixErrors}
                setStaffMatrixErrors={setStaffMatrixErrors}
                keyingErrors={keyingErrors}
                setKeyingErrors={setKeyingErrors}
                staffList={staffList}
                errorTypes={errorTypes}
                onClearAll={handleClearAllToZero}
                onGoToDetailed={() => setActiveTab('detailed_tables')}
                isReadOnly={isExecutiveMode}
              />
            )}

            {activeTab === 'dispensing' && (
              <DailyDispensingView 
                currentMonth={currentMonth}
                dispensingRecords={dispensingRecords}
                setDispensingRecords={setDispensingRecords}
                staffList={staffList}
                isReadOnly={isExecutiveMode}
              />
            )}

            {activeTab === 'history' && (
              <HistoryArchiveView 
                currentMonth={currentMonth}
                onSelectMonthAndView={(m, tab) => { setCurrentMonth(m); setActiveTab(tab || 'detailed_tables'); }}
                dispensingRecords={dispensingRecords}
                staffList={staffList}
                detailedErrors={detailedErrors}
                staffMatrixErrors={staffMatrixErrors}
                keyingErrors={keyingErrors}
                snapshots={snapshots}
                lastSavedAt={lastSavedAt}
                autoBackupFileName={autoBackupFileName}
                onPickAutoBackupFile={handlePickAutoBackupFile}
                onCreateManualSnapshot={handleCreateManualSnapshot}
                onRestoreSnapshot={handleRestoreSnapshot}
                onDeleteSnapshot={handleDeleteSnapshot}
                onExportMonthExcel={(m) => handleExportExcel(m)}
                onExportAllHistoryExcel={handleExportAllHistoryExcel}
                onDownloadJsonBackup={handleDownloadJsonBackup}
                onImportJsonBackup={handleImportJsonBackup}
                isReadOnly={isExecutiveMode}
              />
            )}

            {activeTab === 'settings' && !isExecutiveMode && (
              <SettingsView 
                staffList={staffList}
                setStaffList={setStaffList}
                drugCatalog={drugCatalog}
                setDrugCatalog={setDrugCatalog}
                onClearAll={handleClearAllToZero}
              />
            )}
          </main>

          {isPrintOpen && (
            <PrintModal 
              currentMonth={currentMonth}
              dispensingRecords={dispensingRecords}
              staffList={staffList}
              detailedErrors={detailedErrors}
              onClose={() => setIsPrintOpen(false)}
            />
          )}

          {isShareOpen && (
            <ShareModalHtml
              allState={{ staff: staffList, drugCatalog, dispensing: dispensingRecords, detailedErrors, staffMatrixErrors, keyingErrors }}
              currentMonth={currentMonth}
              onClose={() => setIsShareOpen(false)}
            />
          )}
        </div>
      );
    }

    // Reusable Drug Dropdown + Text Picker
    function DrugSelector({ label, labelClass = 'text-slate-700', value, onChange, drugCatalog, onAddToCatalog, placeholder, inputClass = 'border-slate-300' }) {
      const isAlreadyInCatalog = drugCatalog.some(d => d.name.toLowerCase() === value.trim().toLowerCase());

      return (
        <div className="space-y-1.5">
          <div className="flex items-center justify-between gap-2">
            <label className={`block font-semibold ${labelClass}`}>{label}</label>
            {value.trim() && !isAlreadyInCatalog && onAddToCatalog && (
              <button
                type="button"
                onClick={() => onAddToCatalog(value.trim())}
                className="text-2xs text-teal-700 hover:text-teal-900 font-semibold bg-teal-50 px-1.5 py-0.5 rounded border border-teal-200 cursor-pointer shrink-0"
                title="บันทึกชื่อยานี้เข้าสู่รายการยาเพื่อให้เลือกได้ในครั้งถัดไป"
              >
                + บันทึกเข้าคลังยา
              </button>
            )}
          </div>
          <select
            value={isAlreadyInCatalog ? value : ''}
            onChange={(e) => { if (e.target.value) onChange(e.target.value); }}
            className="w-full px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium text-slate-700 focus:ring-2 focus:ring-teal-500 cursor-pointer"
          >
            <option value="">-- เลือกจากรายการยา ({drugCatalog.length} รายการ) --</option>
            {drugCatalog.map(d => (
              <option key={d.id} value={d.name}>
                {d.name}
              </option>
            ))}
          </select>
          <input
            type="text"
            required
            placeholder={placeholder || 'หรือพิมพ์ชื่อยาเองที่นี่...'}
            value={value}
            onChange={(e) => onChange(e.target.value)}
            className={`w-full border p-2 rounded-xl focus:ring-2 focus:ring-teal-500 ${inputClass}`}
          />
        </div>
      );
    }

    // =========================================================================
    // VIEW 1: บันทึกข้อมูลแยก 4 ตาราง (ไม่มีผู้จัดยา & ไม่มีช่องความแรง/รูปแบบ)
    // =========================================================================
    function DetailedTablesView({ currentMonth, detailedErrors, setDetailedErrors, drugCatalog, setDrugCatalog, onClearAll, isReadOnly = false }) {
      const [activeFilter, setActiveFilter] = useState('all');
      const [modalType, setModalType] = useState(null);
      const [editingItem, setEditingItem] = useState(null);

      // Form states
      const [formDate, setFormDate] = useState(`${currentMonth}-05`);
      const [formNotes, setFormNotes] = useState('');

      const [targetDrug, setTargetDrug] = useState('');
      const [errorDrug, setErrorDrug] = useState('');
      const [subType, setSubType] = useState('different_drug');

      const [drugNameQty, setDrugNameQty] = useState('');
      const [targetQty, setTargetQty] = useState('');
      const [errorQty, setErrorQty] = useState('');

      const [drugNameBasket, setDrugNameBasket] = useState('');
      const [missingCount, setMissingCount] = useState(1);

      const monthTitle = formatThaiMonthYear(currentMonth);

      const monthlyItems = detailedErrors.filter(i => i.date.startsWith(currentMonth)).sort((a,b) => a.date.localeCompare(b.date));
      const wrongDrugList = monthlyItems.filter(i => i.type === 'wrong_drug');
      const incompleteQtyList = monthlyItems.filter(i => i.type === 'incomplete_qty');
      const incompleteBasketList = monthlyItems.filter(i => i.type === 'incomplete_basket');
      const wrongStrengthList = monthlyItems.filter(i => i.type === 'wrong_strength');

      const handleAddDrugToCatalog = (drugName) => {
        if (!drugName) return;
        const exists = drugCatalog.some(d => d.name.toLowerCase() === drugName.toLowerCase());
        if (!exists) {
          setDrugCatalog(prev => [...prev, { id: `drug-${Date.now()}`, name: drugName }]);
        }
      };

      const handleLoadSamples = () => {
        const mapped = SAMPLE_DETAILED_ERRORS.map(item => {
          const day = item.date.split('-')[2] || '05';
          return { ...item, id: `${item.id}-${Date.now()}-${Math.random().toString(36).slice(2,5)}`, date: `${currentMonth}-${day}` };
        });
        setDetailedErrors(prev => [...prev.filter(i => !i.date.startsWith(currentMonth)), ...mapped]);
      };

      const openAddModal = (type) => {
        setEditingItem(null);
        setModalType(type);
        setFormDate(`${currentMonth}-05`);
        setFormNotes('');
        setTargetDrug('');
        setErrorDrug('');
        setSubType('different_drug');
        setDrugNameQty('');
        setTargetQty('');
        setErrorQty('');
        setDrugNameBasket('');
        setMissingCount(1);
      };

      const openEditModal = (item) => {
        setEditingItem(item);
        setModalType(item.type);
        setFormDate(item.date);
        setFormNotes(item.notes || '');
        if (item.type === 'wrong_drug' || item.type === 'wrong_strength') {
          setTargetDrug(item.targetDrug || '');
          setErrorDrug(item.errorDrug || '');
          setSubType(item.subType || 'different_drug');
        } else if (item.type === 'incomplete_qty') {
          setDrugNameQty(item.drugName || '');
          setTargetQty(item.targetQty || '');
          setErrorQty(item.errorQty || '');
        } else {
          setDrugNameBasket(item.drugName || '');
          setMissingCount(item.missingCount || 1);
        }
      };

      const handleDelete = (id) => {
        if (confirm('ยืนยันการลบรายการนี้หรือไม่?')) {
          setDetailedErrors(prev => prev.filter(i => i.id !== id));
        }
      };

      const handleSave = (e) => {
        e.preventDefault();
        let payload = {
          id: editingItem ? editingItem.id : `err-${modalType}-${Date.now()}`,
          date: formDate,
          type: modalType,
          notes: formNotes.trim()
        };
        if (modalType === 'wrong_drug') {
          payload = { ...payload, targetDrug: targetDrug.trim(), errorDrug: errorDrug.trim(), subType };
        } else if (modalType === 'wrong_strength') {
          payload = { ...payload, targetDrug: targetDrug.trim(), errorDrug: errorDrug.trim() };
        } else if (modalType === 'incomplete_qty') {
          payload = { ...payload, drugName: drugNameQty.trim(), targetQty: targetQty.trim(), errorQty: errorQty.trim() };
        } else {
          payload = { ...payload, drugName: drugNameBasket.trim(), missingCount: Number(missingCount) || 1 };
        }

        if (editingItem) {
          setDetailedErrors(prev => prev.map(i => i.id === editingItem.id ? payload : i));
        } else {
          setDetailedErrors(prev => [...prev, payload]);
        }
        setModalType(null);
      };

      return (
        <div className="space-y-6 pb-10">
          {/* Toolbar */}
          <div className="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs flex flex-col lg:flex-row lg:items-center justify-between gap-4">
            <div>
              <h2 className="text-lg font-bold font-prompt text-slate-800 flex items-center gap-2">
                บันทึกข้อมูลความคลาดเคลื่อนแยก 4 ตาราง
                <span className="text-xs px-2.5 py-0.5 rounded-full bg-teal-50 text-teal-700 border border-teal-200 font-semibold">{monthTitle}</span>
              </h2>
              <p className="text-xs text-slate-500 mt-0.5">เลือกรายการยาจากคลังยาหรือพิมพ์ชื่อยาได้ทันที แยกบันทึก 1. ผิดชนิด • 2. ไม่ครบจำนวน • 3. ไม่ครบในตะกร้า • 4. ผิดความแรง</p>
            </div>
            {!isReadOnly && (
              <div className="flex flex-wrap gap-2">
                <button onClick={handleLoadSamples} className="px-3 py-1.5 bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 rounded-xl text-xs font-bold cursor-pointer">
                  ✨ โหลดตัวอย่างข้อมูล (จากภาพ)
                </button>
                <button onClick={onClearAll} className="px-3 py-1.5 bg-slate-100 hover:bg-rose-50 text-slate-700 hover:text-rose-700 border border-slate-200 rounded-xl text-xs font-bold cursor-pointer">
                  🔄 ล้างข้อมูลเป็น 0
                </button>
              </div>
            )}
          </div>

          {/* Filter Pills */}
          <div className="flex flex-wrap gap-2">
            {[
              { id: 'all', label: `แสดงทั้งหมด (${monthlyItems.length})` },
              { id: 'wrong_drug', label: `1. จัดยาผิดชนิด (${wrongDrugList.length})` },
              { id: 'incomplete_qty', label: `2. จัดยาไม่ครบจำนวน (${incompleteQtyList.length})` },
              { id: 'incomplete_basket', label: `3. จัดยาไม่ครบในตะกร้า (${incompleteBasketList.length})` },
              { id: 'wrong_strength', label: `4. จัดยาผิดความแรง (${wrongStrengthList.length})` }
            ].map(f => (
              <button
                key={f.id}
                onClick={() => setActiveFilter(f.id)}
                className={`px-3.5 py-1.5 rounded-xl text-xs font-bold border transition-all cursor-pointer ${
                  activeFilter === f.id ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
                }`}
              >
                {f.label}
              </button>
            ))}
          </div>

          {/* TABLE 1: จัดยาผิดชนิด */}
          {(activeFilter === 'all' || activeFilter === 'wrong_drug') && (
            <div className="bg-white rounded-2xl border border-rose-200 shadow-sm overflow-hidden">
              <div className="px-5 py-3.5 bg-gradient-to-r from-rose-50 to-white border-b border-rose-200 flex flex-wrap items-center justify-between gap-2">
                <div>
                  <h3 className="text-sm font-bold text-slate-800 font-prompt flex items-center gap-2">
                    1. จัดยาผิดชนิด (Wrong Drug)
                    <span className="text-xs px-2 py-0.5 rounded-full bg-rose-100 text-rose-800 font-bold">{wrongDrugList.length} ครั้ง</span>
                  </h3>
                  <p className="text-2xs text-slate-500">คอลัมน์: วันที่ | รายการยาที่ต้องการ | ความคลาดเคลื่อน | ประเภท</p>
                </div>
                {!isReadOnly && (
                  <button onClick={() => openAddModal('wrong_drug')} className="px-3.5 py-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold shadow-xs cursor-pointer">
                    + เพิ่มรายการจัดยาผิดชนิด
                  </button>
                )}
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs border-collapse">
                  <thead>
                    <tr className="bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
                      <th className="py-3 px-4 w-28">วันที่</th>
                      <th className="py-3 px-4">รายการยาที่ต้องการ</th>
                      <th className="py-3 px-2 w-8 text-center">➔</th>
                      <th className="py-3 px-4">ความคลาดเคลื่อน (ยาที่จัดผิด)</th>
                      <th className="py-3 px-3">ประเภทความผิด</th>
                      {!isReadOnly && <th className="py-3 px-3 text-center w-20">จัดการ</th>}
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {wrongDrugList.length === 0 ? (
                      <tr><td colSpan={isReadOnly ? 5 : 6} className="py-8 text-center text-slate-400">ยังไม่มีรายการจัดยาผิดชนิด (0 ครั้ง)</td></tr>
                    ) : (
                      wrongDrugList.map(item => {
                        const subObj = SUBTYPES.find(s => s.id === item.subType) || SUBTYPES[0];
                        return (
                          <tr key={item.id} className="hover:bg-rose-50/30">
                            <td className="py-2.5 px-4 font-semibold whitespace-nowrap">{formatThaiDateShort(item.date)}</td>
                            <td className="py-2.5 px-4 font-bold text-emerald-800 bg-emerald-50/30">{item.targetDrug}</td>
                            <td className="py-2.5 px-2 text-center text-rose-500 font-bold">➔</td>
                            <td className="py-2.5 px-4 font-bold text-rose-700 bg-rose-50/30">{item.errorDrug}</td>
                            <td className="py-2.5 px-3"><span className={`px-2 py-0.5 rounded-full text-2xs font-semibold border ${subObj.color}`}>{subObj.short}</span></td>
                            {!isReadOnly && (
                              <td className="py-2.5 px-3 text-center">
                                <button onClick={() => openEditModal(item)} className="text-teal-600 hover:underline mr-2 cursor-pointer">แก้</button>
                                <button onClick={() => handleDelete(item.id)} className="text-rose-600 hover:underline cursor-pointer">ลบ</button>
                              </td>
                            )}
                          </tr>
                        );
                      })
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* TABLE 2: จัดยาไม่ครบจำนวน */}
          {(activeFilter === 'all' || activeFilter === 'incomplete_qty') && (
            <div className="bg-white rounded-2xl border border-amber-200 shadow-sm overflow-hidden">
              <div className="px-5 py-3.5 bg-gradient-to-r from-amber-50 to-white border-b border-amber-200 flex flex-wrap items-center justify-between gap-2">
                <div>
                  <h3 className="text-sm font-bold text-slate-800 font-prompt flex items-center gap-2">
                    2. จัดยาไม่ครบจำนวน (เม็ดยา)
                    <span className="text-xs px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 font-bold">{incompleteQtyList.length} ครั้ง</span>
                  </h3>
                  <p className="text-2xs text-slate-500">คอลัมน์: วันที่ | ชื่อยา | จำนวน | ความคลาดเคลื่อน</p>
                </div>
                {!isReadOnly && (
                  <button onClick={() => openAddModal('incomplete_qty')} className="px-3.5 py-1.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-xs font-bold shadow-xs cursor-pointer">
                    + เพิ่มรายการจัดยาไม่ครบจำนวน
                  </button>
                )}
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs border-collapse">
                  <thead>
                    <tr className="bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
                      <th className="py-3 px-4 w-28">วันที่</th>
                      <th className="py-3 px-4">ชื่อยา</th>
                      <th className="py-3 px-4 text-center">จำนวน</th>
                      <th className="py-3 px-4 text-center">ความคลาดเคลื่อน</th>
                      {!isReadOnly && <th className="py-3 px-3 text-center w-20">จัดการ</th>}
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {incompleteQtyList.length === 0 ? (
                      <tr><td colSpan={isReadOnly ? 4 : 5} className="py-8 text-center text-slate-400">ยังไม่มีรายการจัดยาไม่ครบจำนวน (0 ครั้ง)</td></tr>
                    ) : (
                      incompleteQtyList.map(item => (
                        <tr key={item.id} className="hover:bg-amber-50/30">
                          <td className="py-2.5 px-4 font-semibold whitespace-nowrap">{formatThaiDateShort(item.date)}</td>
                          <td className="py-2.5 px-4 font-bold text-slate-900">{item.drugName}</td>
                          <td className="py-2.5 px-4 text-center font-bold text-emerald-700 bg-emerald-50/30">{item.targetQty}</td>
                          <td className="py-2.5 px-4 text-center font-bold text-amber-700 bg-amber-50/40">{item.errorQty}</td>
                          {!isReadOnly && (
                            <td className="py-2.5 px-3 text-center">
                              <button onClick={() => openEditModal(item)} className="text-teal-600 hover:underline mr-2 cursor-pointer">แก้</button>
                              <button onClick={() => handleDelete(item.id)} className="text-rose-600 hover:underline cursor-pointer">ลบ</button>
                            </td>
                          )}
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* TABLE 3: จัดยาไม่ครบในตะกร้า */}
          {(activeFilter === 'all' || activeFilter === 'incomplete_basket') && (
            <div className="bg-white rounded-2xl border border-purple-200 shadow-sm overflow-hidden">
              <div className="px-5 py-3.5 bg-gradient-to-r from-purple-50 to-white border-b border-purple-200 flex flex-wrap items-center justify-between gap-2">
                <div>
                  <h3 className="text-sm font-bold text-slate-800 font-prompt flex items-center gap-2">
                    3. จัดยาไม่ครบจำนวน (ยาในตะกร้า)
                    <span className="text-xs px-2 py-0.5 rounded-full bg-purple-100 text-purple-800 font-bold">{incompleteBasketList.length} ครั้ง</span>
                  </h3>
                  <p className="text-2xs text-slate-500">คอลัมน์: วันที่ | จัดยาไม่ครบจำนวน (ยาในตะกร้า) | จำนวนที่ขาด</p>
                </div>
                {!isReadOnly && (
                  <button onClick={() => openAddModal('incomplete_basket')} className="px-3.5 py-1.5 bg-purple-600 hover:bg-purple-700 text-white rounded-xl text-xs font-bold shadow-xs cursor-pointer">
                    + เพิ่มรายการยาไม่ครบในตะกร้า
                  </button>
                )}
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs border-collapse">
                  <thead>
                    <tr className="bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
                      <th className="py-3 px-4 w-28">วันที่</th>
                      <th className="py-3 px-4">จัดยาไม่ครบจำนวน (ยาในตะกร้า)</th>
                      <th className="py-3 px-3 text-center">จำนวนที่ขาด</th>
                      {!isReadOnly && <th className="py-3 px-3 text-center w-20">จัดการ</th>}
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {incompleteBasketList.length === 0 ? (
                      <tr><td colSpan={isReadOnly ? 3 : 4} className="py-8 text-center text-slate-400">ยังไม่มีรายการยาไม่ครบในตะกร้า (0 ครั้ง)</td></tr>
                    ) : (
                      incompleteBasketList.map(item => (
                        <tr key={item.id} className="hover:bg-purple-50/30">
                          <td className="py-2.5 px-4 font-semibold whitespace-nowrap">{formatThaiDateShort(item.date)}</td>
                          <td className="py-2.5 px-4 font-bold text-purple-900">{item.drugName}</td>
                          <td className="py-2.5 px-3 text-center font-bold text-purple-700">{item.missingCount || 1} รายการ</td>
                          {!isReadOnly && (
                            <td className="py-2.5 px-3 text-center">
                              <button onClick={() => openEditModal(item)} className="text-teal-600 hover:underline mr-2 cursor-pointer">แก้</button>
                              <button onClick={() => handleDelete(item.id)} className="text-rose-600 hover:underline cursor-pointer">ลบ</button>
                            </td>
                          )}
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* TABLE 4: จัดยาผิดความแรง */}
          {(activeFilter === 'all' || activeFilter === 'wrong_strength') && (
            <div className="bg-white rounded-2xl border border-sky-200 shadow-sm overflow-hidden">
              <div className="px-5 py-3.5 bg-gradient-to-r from-sky-50 to-white border-b border-sky-200 flex flex-wrap items-center justify-between gap-2">
                <div>
                  <h3 className="text-sm font-bold text-slate-800 font-prompt flex items-center gap-2">
                    4. จัดยาผิดความแรง (Wrong Strength)
                    <span className="text-xs px-2 py-0.5 rounded-full bg-sky-100 text-sky-800 font-bold">{wrongStrengthList.length} ครั้ง</span>
                  </h3>
                  <p className="text-2xs text-slate-500">คอลัมน์: วันที่ | รายการยาที่ต้องการ | ความคลาดเคลื่อน (ความแรงที่จัดผิด)</p>
                </div>
                {!isReadOnly && (
                  <button onClick={() => openAddModal('wrong_strength')} className="px-3.5 py-1.5 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-xs font-bold shadow-xs cursor-pointer">
                    + เพิ่มรายการจัดยาผิดความแรง
                  </button>
                )}
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs border-collapse">
                  <thead>
                    <tr className="bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
                      <th className="py-3 px-4 w-28">วันที่</th>
                      <th className="py-3 px-4">รายการยาที่ต้องการ</th>
                      <th className="py-3 px-2 w-8 text-center">➔</th>
                      <th className="py-3 px-4">ความคลาดเคลื่อน (ความแรงที่จัดผิด)</th>
                      {!isReadOnly && <th className="py-3 px-3 text-center w-20">จัดการ</th>}
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {wrongStrengthList.length === 0 ? (
                      <tr><td colSpan={isReadOnly ? 4 : 5} className="py-8 text-center text-slate-400">ยังไม่มีรายการจัดยาผิดความแรง (0 ครั้ง)</td></tr>
                    ) : (
                      wrongStrengthList.map(item => (
                        <tr key={item.id} className="hover:bg-sky-50/30">
                          <td className="py-2.5 px-4 font-semibold whitespace-nowrap">{formatThaiDateShort(item.date)}</td>
                          <td className="py-2.5 px-4 font-bold text-emerald-800 bg-emerald-50/30">{item.targetDrug}</td>
                          <td className="py-2.5 px-2 text-center text-sky-500 font-bold">➔</td>
                          <td className="py-2.5 px-4 font-bold text-sky-800 bg-sky-50/30">{item.errorDrug}</td>
                          {!isReadOnly && (
                            <td className="py-2.5 px-3 text-center">
                              <button onClick={() => openEditModal(item)} className="text-teal-600 hover:underline mr-2 cursor-pointer">แก้</button>
                              <button onClick={() => handleDelete(item.id)} className="text-rose-600 hover:underline cursor-pointer">ลบ</button>
                            </td>
                          )}
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* Focused Dynamic Modal (ไม่มีผู้จัดยา & ตัดความแรง/รูปแบบออก) */}
          {modalType && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50 overflow-y-auto">
              <div className="bg-white rounded-2xl p-6 max-w-xl w-full shadow-2xl border border-slate-100 my-6">
                <h3 className="font-bold font-prompt text-base mb-4 text-slate-800 border-b pb-2">
                  {modalType === 'wrong_drug'
                    ? '1. บันทึกรายการจัดยาผิดชนิด'
                    : modalType === 'incomplete_qty'
                    ? '2. บันทึกรายการจัดยาไม่ครบจำนวน'
                    : modalType === 'incomplete_basket'
                    ? '3. บันทึกรายการจัดยาไม่ครบในตะกร้า'
                    : '4. บันทึกรายการจัดยาผิดความแรง'}
                </h3>
                <form onSubmit={handleSave} className="space-y-3.5 text-xs">
                  <div>
                    <label className="block font-semibold mb-1">วันที่เกิดเหตุการณ์:</label>
                    <input type="date" required value={formDate} onChange={e => setFormDate(e.target.value)} className="w-full sm:w-1/2 border border-slate-300 p-2 rounded-xl" />
                  </div>

                  {modalType === 'wrong_drug' && (
                    <>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <DrugSelector
                          label="รายการยาที่ต้องการ:"
                          labelClass="text-emerald-800"
                          value={targetDrug}
                          onChange={setTargetDrug}
                          drugCatalog={drugCatalog}
                          onAddToCatalog={handleAddDrugToCatalog}
                          placeholder="เช่น B1, tramadol, Insulin Mixtard 30/70 iu"
                          inputClass="border-emerald-300 bg-emerald-50/30"
                        />
                        <DrugSelector
                          label="ความคลาดเคลื่อน (ยาที่จัดผิด):"
                          labelClass="text-rose-800"
                          value={errorDrug}
                          onChange={setErrorDrug}
                          drugCatalog={drugCatalog}
                          onAddToCatalog={handleAddDrugToCatalog}
                          placeholder="เช่น MTV, diclofenac, Insulin NPH 100 iu"
                          inputClass="border-rose-300 bg-rose-50/30"
                        />
                      </div>
                      <div>
                        <label className="block font-semibold mb-1">ประเภทความผิด:</label>
                        <select value={subType} onChange={e => setSubType(e.target.value)} className="w-full border border-slate-300 p-2 rounded-xl">
                          {SUBTYPES.filter(s => !s.legacyOnly || editingItem?.subType === 'wrong_strength').map(s => (
                            <option key={s.id} value={s.id}>{s.label}</option>
                          ))}
                        </select>
                      </div>
                    </>
                  )}

                  {modalType === 'wrong_strength' && (
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <DrugSelector
                        label="รายการยาที่ต้องการ:"
                        labelClass="text-emerald-800"
                        value={targetDrug}
                        onChange={setTargetDrug}
                        drugCatalog={drugCatalog}
                        onAddToCatalog={handleAddDrugToCatalog}
                        placeholder="เช่น Enalapril 20 mg, risperidone 1 mg"
                        inputClass="border-emerald-300 bg-emerald-50/30"
                      />
                      <DrugSelector
                        label="ความคลาดเคลื่อน (ความแรงที่จัดผิด):"
                        labelClass="text-sky-800"
                        value={errorDrug}
                        onChange={setErrorDrug}
                        drugCatalog={drugCatalog}
                        onAddToCatalog={handleAddDrugToCatalog}
                        placeholder="เช่น Enalapril 5 mg, risperidone 2 mg"
                        inputClass="border-sky-300 bg-sky-50/30"
                      />
                    </div>
                  )}

                  {modalType === 'incomplete_qty' && (
                    <>
                      <DrugSelector
                        label="ชื่อยา:"
                        value={drugNameQty}
                        onChange={setDrugNameQty}
                        drugCatalog={drugCatalog}
                        onAddToCatalog={handleAddDrugToCatalog}
                        placeholder="เช่น risperidone 2 mg, Atorvastatin 40 mg"
                      />
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                          <label className="block font-semibold text-emerald-800 mb-1">จำนวน (ที่ต้องการ):</label>
                          <input type="text" required placeholder="เช่น 255 หรือ 30 เม็ด" value={targetQty} onChange={e => setTargetQty(e.target.value)} className="w-full border border-emerald-300 bg-emerald-50/30 p-2 rounded-xl" />
                        </div>
                        <div>
                          <label className="block font-semibold text-amber-800 mb-1">ความคลาดเคลื่อน:</label>
                          <input type="text" required placeholder="เช่น 195 หรือ ขาด 10 เม็ด" value={errorQty} onChange={e => setErrorQty(e.target.value)} className="w-full border border-amber-300 bg-amber-50/30 p-2 rounded-xl" />
                        </div>
                      </div>
                    </>
                  )}

                  {modalType === 'incomplete_basket' && (
                    <>
                      <DrugSelector
                        label="จัดยาไม่ครบจำนวน (ยาในตะกร้า):"
                        labelClass="text-purple-900"
                        value={drugNameBasket}
                        onChange={setDrugNameBasket}
                        drugCatalog={drugCatalog}
                        onAddToCatalog={handleAddDrugToCatalog}
                        placeholder="เช่น Omeprazole 20 mg, Berodual MDI"
                        inputClass="border-purple-300 bg-purple-50/30"
                      />
                      <div>
                        <label className="block font-semibold mb-1">จำนวนที่ขาด (รายการ):</label>
                        <input type="number" min="1" value={missingCount} onChange={e => setMissingCount(e.target.value)} className="w-full border border-slate-300 p-2 rounded-xl" />
                      </div>
                    </>
                  )}

                  <div className="flex justify-end gap-2 pt-3 border-t">
                    <button type="button" onClick={() => setModalType(null)} className="px-4 py-2 bg-slate-100 rounded-xl font-medium cursor-pointer">ยกเลิก</button>
                    <button type="submit" className="px-5 py-2 bg-teal-600 text-white font-bold rounded-xl shadow-xs cursor-pointer">บันทึกข้อมูล</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // VIEW 2: แดชบอร์ด & สรุป Mederror รายบุคคล / คู่ยา
    // =========================================================================
    function groupDrugPairs(list) {
      const map = {};
      list.forEach(i => {
        const key = `${i.targetDrug} ➔ ${i.errorDrug}`;
        if (!map[key]) map[key] = { pair: key, target: i.targetDrug, error: i.errorDrug, subType: i.subType, count: 0 };
        map[key].count += 1;
      });
      return Object.values(map).sort((a,b) => b.count - a.count);
    }

    function DashboardView({ currentMonth, dispensingRecords, staffList, errorTypes = DEFAULT_ERROR_TYPES, detailedErrors, staffMatrixErrors = [], keyingErrors }) {
      const monthTitle = formatThaiMonthYear(currentMonth);
      const dispErrorTypes = errorTypes?.dispensing || DEFAULT_ERROR_TYPES.dispensing;
      const monthlyDisp = dispensingRecords.filter(r => r.date.startsWith(currentMonth));
      const monthlyDetailed = (detailedErrors || []).filter(e => e.date.startsWith(currentMonth));
      const monthlyMatrix = (staffMatrixErrors || []).filter(e => e.date.startsWith(currentMonth));
      const monthlyKeying = (keyingErrors || []).filter(k => k.date.startsWith(currentMonth));
      
      const wrongDrugList = monthlyDetailed.filter(e => e.type === 'wrong_drug');
      const incompleteQtyList = monthlyDetailed.filter(e => e.type === 'incomplete_qty');
      const incompleteBasketList = monthlyDetailed.filter(e => e.type === 'incomplete_basket');
      const wrongStrengthList = monthlyDetailed.filter(e => e.type === 'wrong_strength');

      let totalDispensed = 0;
      monthlyDisp.forEach(r => Object.values(r.staffCounts || {}).forEach(c => totalDispensed += Number(c)||0));
      const totalPatients = monthlyDisp.reduce((s, r) => s + (Number(r.ipdCount)||0) + (Number(r.opdCount)||0), 0);

      // Pair groupings
      const drugPairs = groupDrugPairs(wrongDrugList);
      const strengthPairs = groupDrugPairs(wrongStrengthList);

      // Individual Staff Mederror Stats
      const staffStats = staffList.map(s => {
        let dispensed = 0;
        monthlyDisp.forEach(r => { dispensed += Number(r.staffCounts?.[s.id]) || 0; });

        const staffMatrix = monthlyMatrix.filter(e => e.staffId === s.id);
        const dispByType = {};
        dispErrorTypes.forEach(t => {
          dispByType[t.id] = staffMatrix.filter(e => e.errorTypeId === t.id).length;
        });

        const dispErrors = staffMatrix.length;
        const keyErrors = monthlyKeying.filter(k => k.staffId === s.id).length;
        const totalErrors = dispErrors + keyErrors;
        const ratePer1000 = dispensed > 0 ? ((dispErrors / dispensed) * 1000).toFixed(2) : '0.00';

        return { ...s, dispensed, dispByType, dispErrors, keyErrors, totalErrors, ratePer1000 };
      });
      const zeroErrorStaffCount = staffStats.filter(s => s.totalErrors === 0).length;

      const staffErrorChartData = {
        labels: staffStats.map(s => s.shortName || s.fullName),
        datasets: [
          {
            label: 'Mederror การจัดยา (ครั้ง)',
            data: staffStats.map(s => s.dispErrors),
            backgroundColor: '#f43f5e',
            borderRadius: 6
          },
          {
            label: 'Mederror การคีย์ยา (ครั้ง)',
            data: staffStats.map(s => s.keyErrors),
            backgroundColor: '#6366f1',
            borderRadius: 6
          }
        ]
      };

      const catChartData = {
        labels: ['1. จัดยาผิดชนิด', '2. จัดยาไม่ครบจำนวน', '3. จัดยาไม่ครบในตะกร้า', '4. จัดยาผิดความแรง'],
        datasets: [{
          data: monthlyDetailed.length === 0 ? [1] : [wrongDrugList.length, incompleteQtyList.length, incompleteBasketList.length, wrongStrengthList.length],
          backgroundColor: monthlyDetailed.length === 0 ? ['#e2e8f0'] : ['#f43f5e', '#f59e0b', '#9333ea', '#0284c7'],
          borderWidth: 2, borderColor: '#fff'
        }]
      };

      const combinedPairs = [...drugPairs, ...strengthPairs];
      const pairChartData = {
        labels: combinedPairs.slice(0, 8).map(p => p.pair),
        datasets: [{
          label: 'จำนวนครั้ง',
          data: combinedPairs.slice(0, 8).map(p => p.count),
          backgroundColor: '#e11d48',
          borderRadius: 6
        }]
      };

      return (
        <div className="space-y-6 pb-10">
          {/* Header Banner */}
          <div className="bg-gradient-to-r from-teal-700 to-slate-900 rounded-2xl p-6 text-white shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
              <span className="bg-teal-500/20 text-teal-200 border border-teal-400/30 px-3 py-0.5 rounded-full text-xs font-semibold">แดชบอร์ดสรุปผลรายเดือน & รายบุคคล</span>
              <h2 className="text-2xl font-bold font-prompt mt-2">สรุปผลห้องยา ประจำเดือน {monthTitle}</h2>
              <p className="text-teal-100 text-xs mt-1">สรุปจัดยาผิดชนิด, จัดยาไม่ครบจำนวน, ยาไม่ครบในตะกร้า, จัดยาผิดความแรง และแดชบอร์ด Mederror รายบุคคล</p>
            </div>
            <div className="bg-white/10 backdrop-blur-md p-4 rounded-xl border border-white/15 text-right">
              <p className="text-2xs text-teal-200">ยอดจัดยารวมเดือนนี้</p>
              <p className="text-2xl font-bold font-prompt">{totalDispensed.toLocaleString()} ใบ</p>
              <p className="text-2xs text-emerald-300">คนไข้รวม {totalPatients} คน • อัตราผิด {totalDispensed > 0 ? ((monthlyDetailed.length/totalDispensed)*1000).toFixed(2) : '0.00'}/1,000</p>
            </div>
          </div>

          {/* 4 Main Error KPI Cards + Total */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
            <div className="bg-white p-5 rounded-2xl border border-rose-200 shadow-xs">
              <span className="text-xs font-bold text-rose-700">1. จัดยาผิดชนิด</span>
              <p className="text-3xl font-bold font-prompt text-rose-600 mt-2">{wrongDrugList.length} <span className="text-xs text-slate-400 font-normal">ครั้ง</span></p>
              <div className="flex flex-wrap gap-1.5 mt-2 text-2xs">
                <span className="bg-rose-50 text-rose-700 px-1.5 py-0.5 rounded">ต่างตัวยา: {wrongDrugList.filter(i=>i.subType==='different_drug').length}</span>
                {wrongDrugList.some(i=>i.subType==='wrong_mix') && (
                  <span className="bg-purple-50 text-purple-700 px-1.5 py-0.5 rounded">ยาผสม: {wrongDrugList.filter(i=>i.subType==='wrong_mix').length}</span>
                )}
              </div>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-amber-200 shadow-xs">
              <span className="text-xs font-bold text-amber-700">2. จัดยาไม่ครบจำนวน</span>
              <p className="text-3xl font-bold font-prompt text-amber-600 mt-2">{incompleteQtyList.length} <span className="text-xs text-slate-400 font-normal">ครั้ง</span></p>
              <p className="text-2xs text-slate-500 mt-2">ความคลาดเคลื่อนจำนวนเม็ด/แผงยา</p>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-purple-200 shadow-xs">
              <span className="text-xs font-bold text-purple-700">3. จัดยาไม่ครบ (ในตะกร้า)</span>
              <p className="text-3xl font-bold font-prompt text-purple-600 mt-2">{incompleteBasketList.length} <span className="text-xs text-slate-400 font-normal">ครั้ง</span></p>
              <p className="text-2xs text-slate-500 mt-2">ลืมหยิบรายการยาใส่ตะกร้า</p>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-sky-200 shadow-xs">
              <span className="text-xs font-bold text-sky-700">4. จัดยาผิดความแรง</span>
              <p className="text-3xl font-bold font-prompt text-sky-600 mt-2">{wrongStrengthList.length} <span className="text-xs text-slate-400 font-normal">ครั้ง</span></p>
              <p className="text-2xs text-slate-500 mt-2">จัดขนาด/ความแรงยาผิดพลาด</p>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-teal-200 shadow-xs">
              <span className="text-xs font-bold text-teal-800">รวมความคลาดเคลื่อนทั้งหมด</span>
              <p className="text-3xl font-bold font-prompt text-slate-800 mt-2">{monthlyDetailed.length} <span className="text-xs text-slate-400 font-normal">ครั้ง</span></p>
              <p className="text-2xs text-teal-700 mt-2">อัตราผิด: {totalDispensed > 0 ? ((monthlyDetailed.length/totalDispensed)*1000).toFixed(2) : '0.00'} / 1,000 ใบ</p>
            </div>
          </div>

          {/* SECTION: แดชบอร์ดสรุป Mederror รายบุคคล */}
          <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
            <div className="px-5 py-4 bg-gradient-to-r from-indigo-50/70 via-rose-50/40 to-white border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <h3 className="text-base font-bold font-prompt text-slate-800">แดชบอร์ดสรุป Mederror รายบุคคล ประจำเดือน {monthTitle}</h3>
                <p className="text-xs text-slate-500">เปรียบเทียบยอดจัดยารวมกับจำนวนความคลาดเคลื่อนการจัดยาและคีย์ยารายบุคคล</p>
              </div>
              <div className="flex flex-wrap gap-2 text-xs font-bold">
                <span className="px-2.5 py-1 rounded-full bg-rose-100 text-rose-800 border border-rose-200">ผิดจัดยารวม {monthlyMatrix.length} ครั้ง</span>
                <span className="px-2.5 py-1 rounded-full bg-indigo-100 text-indigo-800 border border-indigo-200">ผิดคีย์ยารวม {monthlyKeying.length} ครั้ง</span>
                <span className="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-200">0 Error: {zeroErrorStaffCount}/{staffStats.length} คน</span>
              </div>
            </div>

            <div className="p-5 space-y-6">
              <div className="bg-slate-50/70 rounded-xl p-4 border border-slate-200/70">
                <h4 className="text-xs font-bold text-slate-700 font-prompt mb-2">กราฟเปรียบเทียบ Mederror รายบุคคล (การจัดยา vs การคีย์ยา)</h4>
                <ChartBox
                  type="bar"
                  data={staffErrorChartData}

    function MederrorMatrixView({ currentMonth, staffMatrixErrors, setStaffMatrixErrors, keyingErrors, setKeyingErrors, staffList, errorTypes, onClearAll, onGoToDetailed, isReadOnly = false }) {
      const activeStaff = staffList.filter(s => s.canDispense);
      const keyStaff = staffList.filter(s => s.canKey);
      const monthlyMatrix = (staffMatrixErrors || []).filter(e => e.date.startsWith(currentMonth));

      const addMatrixItem = (setList, prefix, staffId, typeId) => {
        setList(prev => [...prev, { id: `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2,5)}`, date: `${currentMonth}-01`, staffId, errorTypeId: typeId }]);
      };

      const subMatrixItem = (list, setList, staffId, typeId) => {
        const target = list.find(e => e.staffId === staffId && e.errorTypeId === typeId);
        if (target) setList(prev => prev.filter(e => e.id !== target.id));
      };

      return (
        <div className="space-y-6 pb-10">
          <div className="bg-white rounded-2xl p-5 border border-slate-200 flex flex-wrap justify-between items-center gap-3">
            <div>
              <h2 className="text-lg font-bold font-prompt text-slate-800">สรุป Mederror รายบุคคล (กด + / - บันทึกรายบุคคล)</h2>
              <p className="text-xs text-slate-500">ประจำเดือน {formatThaiMonthYear(currentMonth)} (แยกจากตารางรายการยา 4 ตาราง)</p>
            </div>
            <div className="flex gap-2">
              <button onClick={onGoToDetailed} className="px-4 py-2 bg-teal-600 text-white rounded-xl text-xs font-bold cursor-pointer">ไปหน้าบันทึกแยก 4 ตาราง (ระบุชื่อยา) ➔</button>
              {!isReadOnly && (
                <button onClick={onClearAll} className="px-3 py-2 bg-slate-100 hover:bg-rose-50 text-slate-700 rounded-xl text-xs font-bold cursor-pointer">ล้างข้อมูลเป็น 0</button>
              )}
            </div>
          </div>

          {/* Dispensing Matrix */}
          <div className="bg-white rounded-2xl border border-slate-300 shadow-xs overflow-hidden">

            </div>

                    <th className="py-3 px-4 border-r border-slate-300 text-left w-56 bg-slate-200">ชื่อ</th>
                    {errorTypes.dispensing.map(t => <th key={t.id} className="py-3 px-3 border-r border-slate-300">{t.name}</th>)}
                    <th className="py-3 px-4 bg-amber-100 font-extrabold w-24">รวม</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-200">
                  {activeStaff.map(s => {
                    const tot = monthlyMatrix.filter(e => e.staffId === s.id).length;
                    return (
                      <tr key={s.id}>
                        <td className="py-2.5 px-4 border-r border-slate-300 font-medium bg-slate-50">{s.fullName}</td>
                        {errorTypes.dispensing.map(t => {

                    const tot = monthlyKey.filter(k => k.staffId === s.id).length;
                    return (
                      <tr key={s.id}>
                        <td className="py-2.5 px-4 border-r border-slate-300 font-medium bg-slate-50">{s.fullName}</td>
                        {errorTypes.keying.map(t => {
                          const cnt = monthlyKey.filter(k => k.staffId === s.id && k.errorTypeId === t.id).length;
